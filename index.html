  <style>
/* =====================================================================
   IMPARA — Feuille de style
   Palette : crème papier, vert basilic, rouge tomate, bleu ardoise.
   Organisation : 1. Tokens · 2. Base · 3. Layout · 4. Composants
                  5. Vues · 6. Animations · 7. Responsive
   ===================================================================== */

/* 1. TOKENS ---------------------------------------------------------- */
:root {
  --paper: #faf7f1;
  --paper-2: #f2ede3;
  --card: #ffffff;
  --ink: #1d2733;
  --ink-2: #4a5666;
  --muted: #7b8594;
  --line: #e7e1d5;
  --verde: #1e8e5a;
  --verde-d: #156b43;
  --verde-l: #e3f3ea;
  --rosso: #d2483f;
  --rosso-l: #fbe9e7;
  --blu: #3b5b7a;
  --oro: #e8b04b;
  --radius: 18px;
  --radius-s: 12px;
  --shadow: 0 1px 2px rgba(29, 39, 51, .05), 0 8px 24px -12px rgba(29, 39, 51, .18);
  --font-display: "Fraunces", Georgia, serif;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --maxw: 1080px;
  --tabbar-h: 0px;
}

/* 2. BASE ------------------------------------------------------------ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.55;
  color: var(--ink); background: var(--paper);
  background-image: radial-gradient(circle at 1px 1px, rgba(29, 39, 51, .045) 1px, transparent 0);
  background-size: 22px 22px;
  min-height: 100vh;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.15; margin: 0 0 .4em; letter-spacing: -.01em; }
h1 { font-size: clamp(1.7rem, 3.4vw, 2.5rem); }
h1 em, .hero em { font-style: italic; font-weight: 500; color: var(--verde); }
h2 { font-size: 1.45rem; }
.h3, h3 { font-size: 1.15rem; }
p { margin: 0 0 .8em; }
a { color: var(--verde-d); }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--oro); outline-offset: 2px; border-radius: 8px; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.lead { font-size: 1.1rem; color: var(--ink-2); }
.eyebrow { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: .35em; }
#app { max-width: var(--maxw); margin: 0 auto; padding: 28px 20px calc(48px + var(--tabbar-h)); outline: none; }

/* 3. LAYOUT : en-tête et navigation ---------------------------------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 20px;
  padding: 12px max(20px, calc((100vw - var(--maxw)) / 2 + 20px));
  background: rgba(250, 247, 241, .88); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand-name { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; }
.topnav { display: flex; gap: 4px; margin-right: auto; }
.topnav a {
  text-decoration: none; color: var(--ink-2); font-weight: 600; font-size: .92rem;
  padding: 8px 12px; border-radius: 999px; transition: background .15s, color .15s; position: relative;
}
.topnav a:hover { background: var(--paper-2); }
.topnav a.active { background: var(--ink); color: #fff; }
.hdr-stats { display: flex; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: .9rem; }
.hdr-profile { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); font-weight: 600; padding: 4px 12px 4px 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); }
.hdr-profile.active { border-color: var(--ink); }
.hdr-avatar { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--paper-2); font-size: 1.05rem; }
.err-badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--rosso); color: #fff; font-size: .7rem; font-weight: 700; font-style: normal; }
.err-badge[hidden] { display: none; }
.tabbar { display: none; }

body.onboarding .topbar, body.onboarding .tabbar,
body.focus-mode .topbar, body.focus-mode .tabbar { display: none; }

/* 4. COMPOSANTS ------------------------------------------------------ */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 20px; border-radius: 14px; border: 1.5px solid transparent;
  font-weight: 700; text-decoration: none; transition: transform .08s, box-shadow .15s, background .15s;
  user-select: none;
}
.btn:active { transform: translateY(2px); }
.btn.primary { background: var(--verde); color: #fff; box-shadow: 0 4px 0 var(--verde-d); }
.btn.primary:hover { background: #22a066; }
.btn.primary:active { box-shadow: 0 2px 0 var(--verde-d); }
.btn.primary:disabled { background: #cfd5cf; box-shadow: 0 4px 0 #b6bdb6; color: #fff; cursor: not-allowed; transform: none; }
.btn.ghost { background: var(--card); border-color: var(--line); color: var(--ink); }
.btn.ghost:hover { border-color: var(--ink-2); }
.btn.danger { background: var(--rosso); color: #fff; box-shadow: 0 4px 0 #a2342d; }
.btn.big { padding: 14px 26px; font-size: 1.02rem; }
.btn.small { padding: 7px 12px; font-size: .85rem; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; font-size: 1rem; }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border-radius: 999px; background: var(--verde-l); color: var(--verde-d); font-weight: 700; font-size: .88rem; }
.chip.warn { background: var(--rosso-l); color: var(--rosso); }
.tag { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .72rem; font-weight: 700; background: var(--lvl, var(--blu)); color: #fff; white-space: nowrap; }
.speak { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); font-size: .95rem; display: grid; place-items: center; transition: background .15s, transform .1s; }
.speak:hover { background: var(--verde-l); }
.speak:active { transform: scale(.92); }
.speak-pair { flex: none; display: inline-flex; flex-direction: column; align-items: center; gap: 4px; }
.speak.slow { width: 28px; height: 28px; font-size: .8rem; }
.empty, .empty-state { color: var(--muted); }
.empty-state { text-align: center; padding: 48px 20px; }
.empty-state span { font-size: 3rem; display: block; margin-bottom: 8px; }
.page-head { margin-bottom: 24px; }
.back { display: inline-block; margin-bottom: 14px; text-decoration: none; font-weight: 600; color: var(--muted); }
.back:hover { color: var(--ink); }

/* Formulaires */
.field { display: block; border: 0; padding: 0; margin: 0 0 18px; }
.field > span, .field > legend { display: block; font-weight: 700; font-size: .9rem; margin-bottom: 8px; padding: 0; }
.field input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: var(--radius-s); background: var(--paper); }
.field input:focus { border-color: var(--verde); outline: none; background: #fff; }
.avatar-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
.avatar-opt { aspect-ratio: 1; border-radius: 12px; border: 2px solid var(--line); background: var(--paper); font-size: 1.4rem; display: grid; place-items: center; transition: transform .1s, border-color .15s; }
.avatar-opt:hover { transform: translateY(-2px); }
.avatar-opt.on { border-color: var(--verde); background: var(--verde-l); }
.seg { display: inline-flex; padding: 4px; background: var(--paper-2); border-radius: 12px; gap: 4px; }
.seg button { border: 0; background: transparent; padding: 8px 14px; border-radius: 9px; font-weight: 600; color: var(--ink-2); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.seg.wide { display: flex; }
.seg.wide button { flex: 1; display: flex; flex-direction: column; align-items: center; }
.seg button small { font-weight: 500; color: var(--muted); font-size: .75rem; }
.switch { display: flex; align-items: center; gap: 10px; margin: 0 0 18px; font-weight: 600; font-size: .92rem; cursor: pointer; }
.switch input { position: absolute; opacity: 0; }
.switch span { width: 42px; height: 24px; border-radius: 999px; background: #ccd2d9; position: relative; transition: background .2s; flex: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch input:checked + span { background: var(--verde); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 3px solid var(--oro); outline-offset: 2px; }

/* Anneau de progression */
.ring { flex: none; }
.ring-bg { fill: none; stroke: var(--paper-2); }
.ring-fg { fill: none; stroke: var(--verde); stroke-linecap: round; transition: stroke-dashoffset .8s cubic-bezier(.2, .8, .2, 1); }
.ring-label { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; fill: var(--ink); }

/* Toasts & modale */
#toast-root { position: fixed; left: 50%; bottom: calc(24px + var(--tabbar-h)); transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 12px; font-weight: 600; font-size: .92rem; box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); transition: all .25s; }
.toast.show { opacity: 1; transform: none; }
.toast-ok { background: var(--verde-d); }
.toast-warn { background: #8a5a12; }
.toast-error { background: var(--rosso); }
.modal-backdrop { position: fixed; inset: 0; background: rgba(29, 39, 51, .45); display: grid; place-items: center; z-index: 90; padding: 20px; animation: fade .2s; }
.modal { background: var(--card); border-radius: var(--radius); padding: 26px; max-width: 460px; width: 100%; box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .35); animation: pop .25s; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
.export-box, .paste textarea { width: 100%; font-family: ui-monospace, monospace; font-size: .78rem; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--paper); }

/* 5. VUES ------------------------------------------------------------ */

/* — Onboarding — */
.onboard { max-width: 620px; margin: 4vh auto 0; text-align: center; }
.onboard .lead { max-width: 520px; margin: 0 auto 28px; }
.onboard-form { text-align: left; }
.onboard-form .btn { width: 100%; }
.flag-stripe { display: inline-flex; width: 72px; height: 8px; border-radius: 99px; overflow: hidden; margin-bottom: 20px; }
.flag-stripe i { flex: 1; }
.flag-stripe i:nth-child(1) { background: var(--verde); } .flag-stripe i:nth-child(2) { background: #fff; border: 1px solid var(--line); } .flag-stripe i:nth-child(3) { background: var(--rosso); }

/* — Parcours (carte des niveaux) — */
.hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: 32px; align-items: end; margin-bottom: 36px; }
.hero h1 { font-size: clamp(2rem, 4.4vw, 3.1rem); }
.hero .btn { margin-top: 8px; }
.hero-meter { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.meter-track { height: 14px; background: var(--paper-2); border-radius: 99px; overflow: hidden; }
.meter-track span { display: block; height: 100%; background: linear-gradient(90deg, var(--verde), #3fb37a); border-radius: 99px; transition: width .8s; min-width: 14px; }
.meter-labels { display: flex; justify-content: space-between; margin-top: 10px; font-weight: 700; font-size: .85rem; color: #c3c8cf; }
.meter-labels span.on { color: var(--verde-d); }
.badge-done { font-weight: 700; color: var(--verde-d); font-size: 1.1rem; }

.path { display: flex; flex-direction: column; gap: 28px; }
.level { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; }
.level-head { display: flex; align-items: center; gap: 16px; padding: 20px 22px; background: linear-gradient(120deg, color-mix(in srgb, var(--lvl) 14%, #fff), #fff 70%); border-bottom: 1px solid var(--line); }
.level-badge { flex: none; width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: var(--lvl); color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; box-shadow: 0 4px 0 color-mix(in srgb, var(--lvl) 70%, #000); }
.level-info { flex: 1; min-width: 0; }
.level-info h2 { margin: 0 0 2px; }
.level-info p { margin: 0; }
.level-prog { text-align: right; font-weight: 700; color: var(--lvl); min-width: 70px; }
.mini-bar { width: 80px; height: 6px; background: var(--paper-2); border-radius: 99px; margin-top: 6px; overflow: hidden; }
.mini-bar i { display: block; height: 100%; background: var(--lvl); }
.lock { font-size: 1.4rem; }
.level.locked .level-head { filter: grayscale(.9); opacity: .75; }
.level-locked-msg { margin: 14px 22px 0; padding: 10px 14px; background: var(--paper); border-radius: 10px; font-size: .9rem; color: var(--muted); text-align: center; }
.nodes { list-style: none; margin: 0; padding: 30px 20px 34px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.node-wrap { display: flex; flex-direction: column; align-items: center; transform: translateX(var(--x)); width: 220px; text-align: center; }
.node {
  position: relative; width: 74px; height: 74px; border-radius: 50%;
  display: grid; place-items: center; text-decoration: none; font-size: 1.9rem;
  background: var(--lvl); color: #fff; box-shadow: 0 6px 0 color-mix(in srgb, var(--lvl) 65%, #000);
  transition: transform .12s, box-shadow .12s;
}
.node.open:hover, .node.done:hover { transform: translateY(-3px); }
.node.open:active, .node.done:active { transform: translateY(3px); box-shadow: 0 2px 0 color-mix(in srgb, var(--lvl) 65%, #000); }
.node.done { background: linear-gradient(145deg, var(--oro), #d9962c); box-shadow: 0 6px 0 #a8731d; }
.node.locked { background: #e3e1dc; box-shadow: 0 6px 0 #c9c6bf; font-size: 1.4rem; cursor: not-allowed; }
.node.current { animation: bob 2.2s ease-in-out infinite; }
.node.current::before { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 3px solid color-mix(in srgb, var(--lvl) 35%, transparent); }
.node.exam { width: 86px; height: 86px; border-radius: 26px; font-size: 2.2rem; }
.node.exam.open { background: var(--ink); box-shadow: 0 6px 0 #000; }
.node-start { position: absolute; top: -34px; background: #fff; color: var(--lvl); border: 2px solid var(--line); font-size: .72rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 4px 10px; border-radius: 10px; white-space: nowrap; }
.node-start::after { content: ""; position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%) rotate(45deg); width: 10px; height: 10px; background: #fff; border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); }
.node-wrap:has(.current) { margin-top: 30px; }
.node-label { margin-top: 12px; display: flex; flex-direction: column; line-height: 1.25; }
.node-label b { font-size: .92rem; }
.node-label small { color: var(--muted); font-size: .78rem; margin-top: 2px; }
.level.locked .node-label { opacity: .55; }

/* — Leçon — */
.lesson { max-width: 780px; margin: 0 auto; }
.lesson-head { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 20px; }
.lesson-emoji { flex: none; width: 76px; height: 76px; border-radius: 22px; display: grid; place-items: center; font-size: 2.3rem; background: color-mix(in srgb, var(--lvl) 14%, #fff); border: 1px solid color-mix(in srgb, var(--lvl) 25%, #fff); }
.lesson-steps { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.lesson-steps a { text-decoration: none; padding: 6px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: .84rem; font-weight: 600; color: var(--ink-2); }
.lesson-steps a:hover { border-color: var(--lvl); color: var(--lvl); }
.lesson-section { margin-bottom: 16px; scroll-margin-top: 90px; }
.lesson-section .h3 { display: flex; align-items: center; gap: 10px; }
.num { width: 28px; height: 28px; border-radius: 9px; background: var(--lvl); color: #fff; display: grid; place-items: center; font-family: var(--font); font-size: .85rem; flex: none; }
.examples { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
.examples li { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--paper); }
.examples div { display: flex; flex-direction: column; }
.it { font-weight: 700; color: var(--ink); }
.fr { color: var(--muted); font-size: .92rem; }
.table-wrap { overflow-x: auto; margin-top: 12px; border-radius: 12px; border: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; font-size: .93rem; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { background: var(--paper-2); font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
tr:last-child td { border-bottom: 0; }
td.first { color: var(--muted); }
tbody tr:nth-child(even) td { background: #fcfbf8; }
.mnemo { display: flex; gap: 16px; align-items: flex-start; padding: 20px 22px; margin: 22px 0; border-radius: var(--radius); background: linear-gradient(120deg, #fff6e2, #fffaf0); border: 1px dashed #e9c77d; }
.mnemo p:last-child { margin: 0; }
.mnemo-icon { font-size: 2rem; }
.vocab-grid { list-style: none; padding: 0; margin: 12px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.vocab-grid li { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 10px; align-items: center; padding: 10px; border-radius: 12px; background: var(--paper); }
.vocab-grid .speak-pair { grid-row: span 2; }
.lesson-cta { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 22px; padding: 20px 22px; border-radius: var(--radius); background: var(--ink); color: #fff; }
.lesson-cta p { margin: 0; font-weight: 600; }

/* — Quiz — */
.quiz { max-width: 720px; margin: 0 auto; min-height: calc(100vh - 60px); display: flex; flex-direction: column; }
.quiz-top { display: flex; align-items: center; gap: 14px; }
.bar { flex: 1; height: 14px; background: var(--paper-2); border-radius: 99px; overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--verde), #3fb37a); border-radius: 99px; transition: width .4s cubic-bezier(.2, .8, .2, 1); }
.quiz-count { font-weight: 700; color: var(--muted); font-size: .9rem; min-width: 44px; text-align: right; }
.quiz-title { margin: 14px 0 22px; color: var(--muted); font-weight: 600; font-size: .9rem; }
.quiz-card { flex: 1; animation: slide .3s; }
.q-label { font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--verde); margin-bottom: 6px; }
.q-text { font-size: clamp(1.35rem, 3vw, 1.8rem); margin-bottom: 24px; }
.options { display: grid; gap: 10px; }
.option { display: flex; align-items: center; gap: 14px; text-align: left; padding: 15px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); font-weight: 600; box-shadow: 0 3px 0 var(--line); transition: border-color .12s, background .12s, transform .08s; }
.option:hover:not(:disabled) { border-color: #cfd6de; background: #fdfcfa; }
.option:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.option kbd { flex: none; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 8px; border: 1.5px solid var(--line); font: 700 .78rem var(--font); color: var(--muted); }
.option.selected { border-color: var(--blu); background: #eef3f8; box-shadow: 0 3px 0 #c2d1e0; }
.option.correct { border-color: var(--verde); background: var(--verde-l); box-shadow: 0 3px 0 #a9d9bf; }
.option.wrong { border-color: var(--rosso); background: var(--rosso-l); box-shadow: 0 3px 0 #f0b9b4; }
.option:disabled { cursor: default; }
.fill-sentence { font-size: 1.35rem; font-weight: 600; line-height: 2.2; }
.fill-input { width: 9ch; min-width: 120px; margin: 0 6px; padding: 4px 10px; border: 0; border-bottom: 3px solid var(--blu); background: #eef3f8; border-radius: 8px 8px 0 0; font-weight: 700; text-align: center; font-size: 1.2rem; }
.fill-input:focus { outline: none; background: #e2ebf4; }
.tr-input { width: 100%; padding: 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); font-size: 1.15rem; resize: none; }
.tr-input:focus { outline: none; border-color: var(--blu); }
.fill-input.correct, .tr-input.correct { border-color: var(--verde); background: var(--verde-l); }
.fill-input.wrong, .tr-input.wrong { border-color: var(--rosso); background: var(--rosso-l); }
.accent-bar { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
.accent-bar button { width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); font-weight: 700; font-size: 1.05rem; box-shadow: 0 2px 0 var(--line); }
.accent-bar button:active { transform: translateY(2px); box-shadow: none; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.match-col { display: grid; gap: 10px; }
.tile { padding: 14px 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); font-weight: 600; box-shadow: 0 3px 0 var(--line); transition: all .12s; min-height: 54px; }
.tile:hover:not(:disabled) { border-color: #cfd6de; }
.tile.sel { border-color: var(--blu); background: #eef3f8; box-shadow: 0 3px 0 #c2d1e0; }
.tile.done { border-color: var(--verde); background: var(--verde-l); color: var(--verde-d); opacity: .6; box-shadow: none; cursor: default; }
.tile.shake { border-color: var(--rosso); background: var(--rosso-l); animation: shake .35s; }
.quiz-foot { position: sticky; bottom: 0; margin: 28px -20px 0; padding: 18px 20px calc(18px + env(safe-area-inset-bottom)); border-top: 2px solid var(--line); background: var(--paper); display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.quiz-foot .btn { margin-left: auto; min-width: 180px; }
.quiz-foot.is-correct { background: var(--verde-l); border-color: #a9d9bf; }
.quiz-foot.is-wrong { background: var(--rosso-l); border-color: #f0b9b4; }
.quiz-foot.is-wrong .btn.primary { background: var(--rosso); box-shadow: 0 4px 0 #a2342d; }
.feedback { flex: 1 1 300px; animation: slide .25s; }
.feedback strong { font-family: var(--font-display); font-size: 1.3rem; display: block; margin-bottom: 4px; }
.is-correct .feedback strong { color: var(--verde-d); }
.is-wrong .feedback strong { color: var(--rosso); }
.feedback p { margin: 0 0 4px; }
.feedback .explain { color: var(--ink-2); }

/* — Résultats — */
.results { max-width: 520px; margin: 4vh auto 0; text-align: center; animation: pop .35s; }
.results .ring-fg { stroke: var(--verde); }
.results.ko .ring-fg { stroke: var(--oro); }
.stars { font-size: 2.4rem; letter-spacing: 6px; margin: 6px 0 4px; color: #ddd8ce; }
.stars .on { color: var(--oro); text-shadow: 0 2px 0 #b27d1e; }
.result-chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 16px 0 24px; }
.result-actions { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.result-actions .btn { min-width: 260px; }

/* — Tableau de bord — */
.dash-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 18px; }
.dash-main { display: flex; align-items: center; gap: 28px; }
.dash-main h2 { font-size: 1.8rem; }
.goal { display: flex; align-items: center; gap: 18px; }
.goal .ring-label { font-size: 1.3rem; }
.goal .ring-fg { stroke: var(--oro); }
.stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 2px; box-shadow: var(--shadow); text-decoration: none; color: var(--ink); }
.stat.link:hover { border-color: var(--verde); }
.stat.warn b { color: var(--rosso); }
.stat-icon { font-size: 1.3rem; }
.stat b { font-family: var(--font-display); font-size: 1.7rem; line-height: 1.1; }
.stat small { color: var(--muted); font-size: .8rem; }
.level-bars { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 12px; }
.level-bars li { display: grid; grid-template-columns: 40px 110px 1fr 46px; align-items: center; gap: 10px; }
.level-bars li.locked { opacity: .5; }
.lb-id { font-weight: 800; color: var(--lvl); white-space: nowrap; }
.level-badge { line-height: 1; }
.level-badge .badge-pre { display: block; font-family: var(--font-body, inherit); font-size: .5em; font-weight: 700; letter-spacing: .06em; opacity: .9; margin-bottom: 2px; }
.lb-name { font-size: .9rem; color: var(--ink-2); }
.lb-bar { height: 10px; background: var(--paper-2); border-radius: 99px; overflow: hidden; }
.lb-bar i { display: block; height: 100%; background: var(--lvl); border-radius: 99px; transition: width .8s; }
.lb-pct { text-align: right; font-weight: 700; font-size: .88rem; }
.history { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
.history li { display: grid; grid-template-columns: 10px 1fr auto auto; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
.history li:last-child { border: 0; }
.h-dot { width: 10px; height: 10px; border-radius: 50%; }
.h-dot.ok { background: var(--verde); } .h-dot.ko { background: var(--oro); }
.h-score { font-weight: 700; }
.history time { color: var(--muted); font-size: .8rem; }

/* — Carnet — */
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 18px; }
.search { flex: 1 1 260px; padding: 11px 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); }
.search:focus { outline: none; border-color: var(--verde); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-btn { padding: 7px 13px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-weight: 700; font-size: .85rem; }
.chip-btn.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.word-list { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.word-list li { display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; column-gap: 12px; align-items: center; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.word-list .speak-pair { grid-row: span 2; }
.word-list .tag { grid-row: span 2; grid-column: 3; }
.word-list .it { grid-column: 2; } .word-list .fr { grid-column: 2; }
.flash-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.flashcard { width: min(440px, 100%); aspect-ratio: 3 / 2; border: 0; padding: 0; background: none; perspective: 1200px; position: relative; }
.flashcard .face { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border-radius: 22px; backface-visibility: hidden; transition: transform .5s cubic-bezier(.2, .8, .2, 1); box-shadow: var(--shadow); padding: 20px; }
.flashcard .front { background: var(--card); border: 1px solid var(--line); }
.flashcard .back { background: var(--verde); color: #fff; transform: rotateY(180deg); }
.flashcard.flipped .front { transform: rotateY(-180deg); }
.flashcard.flipped .back { transform: rotateY(0); }
.face small { text-transform: uppercase; letter-spacing: .1em; font-weight: 700; font-size: .72rem; opacity: .65; }
.face b { font-family: var(--font-display); font-size: clamp(1.5rem, 4vw, 2.2rem); text-align: center; }
.face em { font-size: .85rem; opacity: .7; }
.card-type button { font-size: .85rem; }
.flashcard .big-py { font-size: clamp(2rem, 7vw, 2.8rem); font-weight: 700; letter-spacing: .01em; }
.flash-nav { display: flex; align-items: center; gap: 16px; font-weight: 700; }

/* — Cahier d'erreurs — */
.error-list { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.error-item { padding: 18px; border-left: 4px solid var(--rosso); }
.err-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.err-top .tag { background: var(--ink-2); }
.err-count { margin-left: auto; color: var(--rosso); font-weight: 700; font-size: .85rem; }
.err-mastery { color: var(--verde); letter-spacing: 2px; font-size: .8rem; }
.err-q { font-weight: 700; }
.err-given { color: var(--rosso); font-size: .92rem; margin-bottom: 4px; }
.err-ok { color: var(--verde-d); font-size: .92rem; margin-bottom: 6px; }
.err-explain { font-size: .88rem; color: var(--ink-2); background: var(--paper); padding: 8px 10px; border-radius: 10px; margin: 0; }

/* — Profil — */
.big-avatar { display: inline-grid; place-items: center; width: 56px; height: 56px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); font-size: 1.8rem; vertical-align: middle; margin-right: 6px; }
.profile-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; align-items: start; }
.file-btn { cursor: pointer; }
.paste summary { cursor: pointer; font-weight: 600; font-size: .9rem; margin-bottom: 8px; }
.paste textarea { margin-bottom: 8px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }

/* 6. ANIMATIONS ------------------------------------------------------ */
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes slide { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } }
@keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 120; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; animation: fall 2.2s cubic-bezier(.3, .6, .5, 1) forwards; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* 7. RESPONSIVE ------------------------------------------------------ */
@media (max-width: 920px) {
  .topnav, #hdr-pseudo { display: none; }
  .hdr-stats { margin-left: auto; }
  .hdr-profile { padding: 3px; }
  .hero { grid-template-columns: 1fr; gap: 20px; }
  .dash-grid, .profile-grid { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 720px) {
  :root { --tabbar-h: 68px; }
  .topbar { padding: 10px 16px; }
  .hdr-profile { display: none; }
  .tabbar {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    height: calc(var(--tabbar-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
    background: rgba(255, 255, 255, .95); backdrop-filter: blur(12px); border-top: 1px solid var(--line);
  }
  .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--muted); font-size: .7rem; font-weight: 700; position: relative; }
  .tabbar a > span { font-size: 1.3rem; line-height: 1; position: relative; filter: grayscale(.6); }
  .tabbar a > span.hdr-avatar { width: 26px; height: 26px; font-size: 1rem; }
  .tabbar a.active { color: var(--verde-d); }
  .tabbar a.active > span { filter: none; transform: translateY(-1px); }
  .tabbar .err-badge { position: absolute; top: -6px; right: -12px; }
  #app { padding: 20px 16px calc(32px + var(--tabbar-h)); }
  .card { padding: 18px; }
  .level-head { padding: 16px; gap: 12px; }
  .level-badge { width: 46px; height: 46px; font-size: 1.1rem; border-radius: 13px; }
  .level-info h2 { font-size: 1.15rem; }
  .level-info .small { display: none; }
  .mini-bar { width: 56px; }
  .node-wrap { width: 190px; transform: translateX(calc(var(--x) * .6)); }
  .lesson-head { flex-direction: column; gap: 12px; }
  .lesson-emoji { width: 60px; height: 60px; font-size: 1.8rem; }
  .lesson-cta { flex-direction: column; align-items: stretch; text-align: center; }
  .dash-main { flex-direction: column; text-align: center; gap: 14px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .level-bars li { grid-template-columns: 34px 1fr 40px; }
  .lb-name { display: none; }
  .avatar-grid { grid-template-columns: repeat(6, 1fr); }
  .quiz-foot { margin: 20px -16px 0; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }
  .quiz-foot .btn { width: 100%; margin: 0; }
  .match { gap: 8px; }
  .tile { padding: 12px 8px; font-size: .9rem; }
  .fill-sentence { font-size: 1.15rem; }
  .result-actions .btn { min-width: 0; width: 100%; }
  .word-list, .error-list { grid-template-columns: 1fr; }
}

/* 8. SÉLECTEUR DE LANGUE --------------------------------------------- */
.lang-switch { position: relative; }
.brand { border: 0; background: transparent; padding: 6px 10px 6px 6px; margin-left: -6px; border-radius: 12px; transition: background .15s; }
.brand:hover, .brand[aria-expanded="true"] { background: var(--paper-2); }
.brand-flag, .flag { display: inline-flex; flex: none; }
.brand-flag svg { width: 33px; height: 22px; border-radius: 5px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .08), var(--shadow); display: block; }
.caret { font-size: .8rem; color: var(--muted); transition: transform .2s; }
.brand[aria-expanded="true"] .caret { transform: rotate(180deg); }
.lang-menu { position: absolute; top: calc(100% + 8px); left: -6px; z-index: 50; width: 280px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 8px; box-shadow: 0 24px 50px -16px rgba(29, 39, 51, .35); animation: pop .18s; }
.lang-menu[hidden] { display: none; }
.lang-menu-title { margin: 6px 10px 8px; font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.lang-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px; border: 0; border-radius: 12px; background: transparent; text-align: left; }
.lang-item:hover, .lang-item:focus-visible { background: var(--paper); }
.lang-item.on { background: var(--paper-2); }
.lang-item .flag svg, .lang-chip .flag svg { width: 30px; height: 20px; border-radius: 4px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .08); display: block; }
.lang-txt { flex: 1; display: flex; flex-direction: column; line-height: 1.25; }
.lang-txt small { color: var(--muted); font-size: .78rem; }
.check { font-weight: 800; color: var(--verde); }
.lang-menu-note { margin: 8px 10px 4px; font-size: .75rem; color: var(--muted); }
.lang-pick { display: inline-flex; gap: 8px; margin-bottom: 22px; padding: 5px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow); }
.lang-chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px 7px 8px; border: 0; border-radius: 999px; background: transparent; font-weight: 700; color: var(--ink-2); }
.lang-chip.on { background: var(--ink); color: #fff; }

/* 9. THÈME MANDARIN (body.lang-zh) ----------------------------------- */
:root { --font-zh: "Noto Serif SC", "Noto Serif CJK SC", "Songti SC", "SimSun", serif; --accent: var(--verde); --accent-d: var(--verde-d); }
body.lang-zh {
  --verde: #2a8a66; --verde-d: #1e6b4e; --verde-l: #e2f2ea;
  --rosso: #c9483e; --oro: #d9a441;
  --accent: #c23b32; --accent-d: #8f2a23;
  --font: "Plus Jakarta Sans", "Noto Sans SC", system-ui, -apple-system, sans-serif;
}
body.lang-zh .btn.primary { background: var(--accent); box-shadow: 0 4px 0 var(--accent-d); }
body.lang-zh .btn.primary:hover { background: #d4463c; }
body.lang-zh .btn.primary:disabled { background: #cfd5cf; box-shadow: 0 4px 0 #b6bdb6; }
body.lang-zh .quiz-foot.is-correct .btn.primary { background: var(--verde); box-shadow: 0 4px 0 var(--verde-d); }
body.lang-zh .quiz-foot.is-wrong .btn.primary { background: var(--rosso); box-shadow: 0 4px 0 #a2342d; }
body.lang-zh h1 em, body.lang-zh .hero em { color: var(--accent); }

/* Caractères chinois et pinyin */
.zh { font-family: var(--font-zh); font-weight: 700; font-size: 1.15em; letter-spacing: .02em; }
.py { color: var(--accent); font-weight: 600; font-size: .88rem; }
small.py { display: block; margin-top: 2px; font-size: .78rem; }
.examples .it.zh { font-size: 1.3rem; line-height: 1.3; }
.vocab-grid li.has-py { grid-template-rows: auto auto auto; }
.vocab-grid li.has-py .speak-pair { grid-row: span 3; }
.vocab-grid .it.zh { font-size: 1.3rem; }
.big-zh { font-size: clamp(2.6rem, 9vw, 4rem) !important; }
.tile .zh { display: block; font-size: 1.25rem; }
.tone-hint { flex-basis: 100%; font-size: .78rem; color: var(--muted); }
.accent-bar button[data-t] { color: var(--accent); }

/* 10. COMPTE & SYNCHRONISATION -------------------------------------- */
.cloud-pill { text-decoration: none; color: var(--ink); gap: 6px; font-weight: 600; }
.cloud-pill span:empty { display: none; }
.cloud-pill.cloud-error { border-color: var(--rosso); }
.cloud-pill.cloud-syncing { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.account-card { max-width: 520px; }
.auth-form .seg { margin-bottom: 18px; }
.auth-form .btn.big { width: 100%; margin-top: 4px; }
.form-msg { min-height: 0; margin: 0 0 12px; font-size: .9rem; font-weight: 600; }
.form-msg:empty { display: none; }
.form-msg.error { color: var(--rosso); }
.form-msg.ok { color: var(--verde-d); background: var(--verde-l); padding: 10px 12px; border-radius: 10px; }
.hint-ok { color: var(--verde-d); margin: -6px 0 12px; }
.center { text-align: center; margin: 14px 0 0; }
.acc-row { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.acc-row p { margin: 0; }
.acc-avatar { width: 52px; height: 52px; border-radius: 16px; background: var(--paper-2); display: grid; place-items: center; font-size: 1.7rem; }
.sync-box { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--paper); margin-bottom: 14px; }
.sync-box p { margin: 2px 0 0; }
.sync-box.sync-synced { background: var(--verde-l); }
.sync-box.sync-error { background: var(--rosso-l); }
.sync-icon { font-size: 1.3rem; }
body.onboarding #app .account-card { margin: 0 auto; }
body.onboarding #app .page-head { max-width: 520px; margin: 4vh auto 24px; }
code { background: var(--paper-2); padding: 1px 6px; border-radius: 6px; font-size: .88em; }
@media (max-width: 720px) { .cloud-pill span { display: none; } }
.topnav a { white-space: nowrap; }
@media (max-width: 1180px) { .cloud-pill span { display: none; } }

/* 8. ESPACE AMIS ------------------------------------------------------ */
[data-tab][hidden] { display: none !important; }
.back-link { display: inline-block; margin-bottom: 14px; font-weight: 700; text-decoration: none; color: var(--ink-2); }
.back-link:hover { color: var(--ink); }
.link-btn { background: none; border: 0; padding: 0; color: var(--verde-d); font-weight: 700; text-decoration: underline; font-size: inherit; }
.danger-txt { color: var(--rosso); }
.s-loading { text-align: center; padding: 60px 0; }
.flag.mini svg { width: 20px; height: 14px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .1); display: block; }
.flag.mini { vertical-align: -2px; margin-right: 4px; }
.s-me { color: var(--ink); }
.s-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
.s-col { display: grid; gap: 20px; min-width: 0; }
.s-page .card h2.h3 { margin-bottom: 14px; }
.s-highlight { border-color: color-mix(in srgb, var(--oro) 60%, var(--line)); background: #fffaf0; }
.s-add-row { display: flex; align-items: center; gap: 8px; }
.s-add-row input { flex: 1; min-width: 0; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: var(--radius-s); background: var(--paper); }
.s-add-row input:focus { border-color: var(--verde); outline: none; background: #fff; }
.s-at { font-weight: 800; color: var(--muted); font-size: 1.1rem; }
.s-add .form-msg { margin-top: 10px; }
.s-list, .s-ch-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.s-row { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: var(--radius-s); border: 1px solid var(--line); background: var(--card); color: inherit; text-decoration: none; }
.s-friend:hover { border-color: var(--ink-2); }
.s-row-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.s-row-txt b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-row-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.s-handle { color: var(--muted); font-size: .82rem; font-weight: 600; }
.s-avatar { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--paper-2); font-size: 1.4rem; line-height: 1; }
.s-avatar.sm { width: 36px; height: 36px; font-size: 1.15rem; }
.s-avatar.lg { width: 60px; height: 60px; font-size: 2rem; }
.s-avatar.xl { width: 76px; height: 76px; font-size: 2.6rem; }
.s-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.s-lang-chip { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; background: var(--paper-2); font-size: .78rem; font-weight: 700; }
.s-unread { flex: none; background: var(--rosso); color: #fff; font-weight: 800; font-size: .78rem; padding: 4px 9px; border-radius: 999px; }
.s-go { color: var(--muted); font-size: 1.5rem; line-height: 1; }

.s-challenge { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-s); border: 1px solid var(--line); background: var(--card); }
.s-challenge.todo { border-color: var(--oro); background: #fffaf0; }
.s-challenge.win { border-left: 4px solid var(--verde); }
.s-challenge.lose { border-left: 4px solid var(--rosso); }
.s-challenge.draw { border-left: 4px solid var(--blu); }
.s-challenge.off { opacity: .6; }
.s-ch-icon { font-size: 1.3rem; }
.s-ch-body { flex: 1; min-width: 0; }
.s-ch-body p { margin: 0; font-size: .92rem; }
.s-ch-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.s-outcome { margin-right: 2px; }

.s-friend-head { display: flex; align-items: center; gap: 18px; margin-bottom: 20px; flex-wrap: wrap; }
.s-friend-head h1 { margin: 0; }
.s-friend-id { flex: 1; min-width: 160px; }
.s-friend-id p { margin: 4px 0 0; }
.s-friend-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.s-cmp + .s-cmp { margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--line); }
.s-cmp-lang { display: flex; align-items: center; font-weight: 800; margin-bottom: 10px; }
.s-cmp-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.s-cmp-who { font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 2px; }
.s-cmp-lvl { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; margin-bottom: 6px; }
.s-cmp-lvl small { font-family: var(--font); font-size: .8rem; color: var(--muted); font-weight: 600; }
.s-cmp-col .small { margin: 6px 0 0; }
.s-bar { height: 8px; border-radius: 99px; background: var(--paper-2); overflow: hidden; }
.s-bar span { display: block; height: 100%; background: var(--verde); border-radius: 99px; }
body.lang-zh .s-bar span { background: var(--accent, var(--verde)); }

.s-chat { display: flex; flex-direction: column; height: min(640px, calc(100vh - 160px)); min-height: 380px; position: sticky; top: 88px; }
.s-msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px 10px; }
.s-msg { max-width: 82%; padding: 9px 13px; border-radius: 16px; background: var(--paper-2); align-self: flex-start; border-bottom-left-radius: 5px; }
.s-msg.me { align-self: flex-end; background: var(--verde); color: #fff; border-bottom-left-radius: 16px; border-bottom-right-radius: 5px; }
body.lang-zh .s-msg.me { background: var(--accent, var(--verde)); }
.s-msg p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.s-msg time { display: block; font-size: .7rem; opacity: .7; margin-top: 3px; text-align: right; }
.s-empty { text-align: center; margin: auto 0; }
.s-send { display: flex; gap: 8px; align-items: flex-end; border-top: 1px solid var(--line); padding-top: 12px; }
.s-send textarea { flex: 1; resize: none; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--paper); max-height: 140px; line-height: 1.4; }
.s-send textarea:focus { border-color: var(--verde); outline: none; background: #fff; }
.s-send .btn { padding: 11px 16px; }

.s-defi-intro, .s-defi-res { max-width: 640px; margin: 0 auto; text-align: center; }
.s-defi-intro .btn.big { margin-top: 10px; min-width: 240px; }
.s-vs, .s-res { display: flex; align-items: center; justify-content: center; gap: 22px; margin: 14px 0 18px; }
.s-vs-x { font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; color: var(--muted); }
.s-res-col { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 120px; }
.s-res-col p { margin: 0; }
.s-res-who { font-weight: 800; }
.s-defi-res.win h1 { color: var(--verde-d); }
.s-defi-res .result-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }

@media (max-width: 860px) {
  .s-grid { grid-template-columns: 1fr; }
  .s-chat { position: static; height: 70vh; }
}
@media (max-width: 520px) {
  .s-friend-actions { align-items: flex-start; width: 100%; }
  .s-cmp-cols { gap: 10px; }
  .s-challenge { flex-wrap: wrap; }
  .s-ch-actions { width: 100%; justify-content: flex-start; padding-left: 48px; }
  .s-res { gap: 10px; }
  .s-res-col { min-width: 0; }
}

/* 9. RÉVISION ESPACÉE ET ENTRAÎNEMENT -------------------------------- */
.head-actions { margin-top: 12px; }
.hero-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.count-pill { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; margin-left: 4px; border-radius: 999px; background: var(--rosso); color: #fff; font-size: .72rem; font-weight: 800; }
.srs-stats { margin: 0; text-align: center; }
.new-chip { margin-bottom: -6px; }
.grade-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(440px, 100%); }
.btn.grade { flex-direction: column; gap: 2px; padding: 10px 6px; font-size: .92rem; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); }
.btn.grade small { font-weight: 600; font-size: .72rem; color: var(--muted); }
.btn.grade.again { border-color: #f0b4ae; background: var(--rosso-l); }
.btn.grade.hard { border-color: #f0d49c; background: #fff6e2; }
.btn.grade.good { border-color: #a9dcc0; background: var(--verde-l); }
.srs-done { text-align: center; width: min(440px, 100%); }
.big-emoji { font-size: 3rem; display: block; margin-bottom: 6px; }

.train-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.train-card { text-decoration: none; color: inherit; transition: transform .15s, border-color .15s; }
.train-card:hover { transform: translateY(-2px); border-color: var(--ink-2); }
.train-card.disabled { opacity: .55; }
.train-card.disabled:hover { transform: none; border-color: var(--line); }
.train-icon { font-size: 2.2rem; display: block; margin-bottom: 8px; }
.train-card p { margin: 0; }

.listen-bar { display: flex; justify-content: center; gap: 12px; margin-bottom: 18px; }
.listen-btn { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; width: 104px; padding: 14px 10px; border-radius: 18px; border: 1.5px solid var(--line); background: var(--card); font-size: 2rem; box-shadow: 0 3px 0 var(--line); }
.listen-btn span { font-size: .78rem; font-weight: 700; color: var(--ink-2); }
.listen-btn:active { transform: translateY(2px); box-shadow: none; }
.listen-btn.slow { font-size: 1.6rem; }

.trace-card { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.trace-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; width: 100%; }
.trace-title { font-size: 2.2rem; margin: 0; }
.trace-info { margin: 2px 0 0; }
.trace-box { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.trace-writer { width: 300px; height: 300px; max-width: 100%; border-radius: 18px; background:
  linear-gradient(var(--line), var(--line)) center / 100% 1px no-repeat,
  linear-gradient(var(--line), var(--line)) center / 1px 100% no-repeat, var(--paper); border: 1.5px solid var(--line); display: grid; place-items: center; touch-action: none; }
.trace-msg { min-height: 1.4em; margin: 0; text-align: center; font-weight: 600; font-size: .92rem; }
.trace-actions { justify-content: center; margin: 0; }
.trace-list { width: 100%; }
.trace-list summary { cursor: pointer; font-weight: 700; text-align: center; }
.trace-chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }
.trace-chips .chip-btn { font-size: 1.1rem; }
@media (max-width: 520px) {
  .grade-row { gap: 6px; }
  .btn.grade { font-size: .82rem; }
}
.s-board { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 6px; }
.s-board li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-s); background: var(--paper); }
.s-board li.me { background: var(--verde-l); }
.s-rank { width: 26px; text-align: center; font-weight: 800; font-size: 1.05rem; }
.s-board-name { flex: 1; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.push-zone { margin-top: 12px; }
.s-push-hint p { margin-bottom: 10px; } .s-push-hint .btn-row { margin: 0; }
.s-col > div:empty { display: none; }

        <h2 class="q-text"></h2>

      </div>

        <div class="feedback" hidden></div>
        <button class="btn primary big quiz-action" disabled>V\xE9rifier</button>
      </footer>

    const foot = root.querySelector(".quiz-foot");
    foot.classList.add(res.correct ? "is-correct" : "is-wrong");

    feedback.innerHTML = res.correct ? `<strong>\u2713 ${L.cheers[i % L.cheers.length]}</strong>${res.note ? `<p>${esc(res.note)}</p>` : ""}${q.explain ? `<p class="muted">${esc(q.explain)}</p>` : ""}` : `<strong>\u2717 Pas tout \xE0 fait\u2026</strong>

  app._cleanup?.();

  const raw = decodeURIComponent(location.hash.slice(1));
  if (!state.profile && raw === "compte") {
    document.body.classList.add("onboarding");
    renderCompte(app);
    return;
  }
  if (!state.profile) {
    document.body.classList.add("onboarding");
    renderOnboarding(app, () => {
      document.body.classList.remove("onboarding");
      location.hash = "parcours";
      route();
    });
    return;
  }
  document.body.classList.remove("onboarding");
  const hash = decodeURIComponent(location.hash.slice(1)) || "parcours";
  for (const [re, render, tab] of ROUTES) {
    const m = hash.match(re);
    if (!m) continue;
    if (render(app, m) === false) {
      toast("\u{1F512} Cette \xE9tape n'est pas encore d\xE9bloqu\xE9e", "warn");
      location.hash = "parcours";
