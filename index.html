8S la dur\xE9e (<i>due giorni fa</i> = il y a deux jours). <b>scorso</b> s'accorde (<i>la settimana scorsa, l'anno scorso</i>). <b>gi\xE0</b> = d\xE9j\xE0, <b>non\u2026 ancora</b> = pas encore, <b>appena</b> = venir de.",examples:[["Sono arrivata tre giorni fa.","Je suis arriv\xE9e il y a trois jours."],["L'estate scorsa siamo stati in Sicilia.","L'\xE9t\xE9 dernier, nous avons \xE9t\xE9 en Sicile."],["Hai gi\xE0 mangiato? \u2014 No, non ho ancora mangiato.","Tu as d\xE9j\xE0 mang\xE9 ? \u2014 Non, pas encore."],["Il treno \xE8 appena partito.","Le train vient de partir."]]}],mnemo:"Essere = \xAB la maison DR. MRS VANDERTRAMP \xBB des Fran\xE7ais : les verbes de mouvement et de changement d'\xE9tat. En plus, TOUS les verbes en -si prennent essere.",vocab:[["tornare","rentrer, revenir"],["uscire","sortir"],["nascere","na\xEEtre"],["restare","rester"],["diventare","devenir"],["divertirsi","s'amuser"],["fa","il y a (dur\xE9e)"],["scorso","dernier (pass\xE9)"],["gi\xE0","d\xE9j\xE0"],["non\u2026 ancora","pas encore"],["appena","venir de, \xE0 peine"],["tardi","tard"],["presto","t\xF4t, bient\xF4t"],["il fine settimana","le week-end"]],quiz:[H("Giulia (partire) hier : ",["Giulia ha partito ieri.","Giulia \xE8 partito ieri.","Giulia \xE8 partita ieri.","Giulia ha partita ieri."],2,"Partire \u2192 essere, et accord au f\xE9minin : \xE8 partita."),le("Stamattina mi ___ alzata alle sette. (suis)",["sono"],"Verbe pronominal \u2192 essere : mi sono alzata."),H("\xAB Il y a deux ans \xBB :",["fa due anni","due anni fa","ci sono due anni","da due anni"],1,"fa se place apr\xE8s la dur\xE9e : due anni fa."),le("Noi ci siamo ___ molto alla festa. (divertirsi, sujet masculin pluriel)",["divertiti"],"ci siamo divertiti (accord au pluriel)."),H("\xAB Tu as d\xE9j\xE0 mang\xE9 ? \xBB :",["Hai ancora mangiato?","Hai gi\xE0 mangiato?","Sei gi\xE0 mangiato?","Hai mangiato fa?"],1,"Mangiare \u2192 avere ; gi\xE0 = d\xE9j\xE0."),H("Quelle phrase est correcte ?",["Ho andato a Roma.","Sono an ,intro:"Plus grand, moins cher, aussi beau, le meilleur : comparer des villes, des prix, des personnes.",sections:[{title:"Plus / moins / aussi",text:"<b>pi\xF9</b> + adjectif + <b>di</b> (= plus\u2026 que) \xB7 <b>meno</b> + adjectif + <b>di</b> \xB7 <b>(cos\xEC)</b> + adjectif + <b>come</b> ou <b>tanto\u2026 quanto</b> (= aussi\u2026 que). <b>di</b> se contracte avec l'article : <i>del, della\u2026</i>",examples:[["Roma \xE8 pi\xF9 grande di Firenze.","Rome est plus grande que Florence."],["Il treno \xE8 meno caro dell'aereo.","Le train est moins cher que l'avion."],["Luca \xE8 alto come suo padre.","Luca est aussi grand que son p\xE8re."]]},{title:"Pi\xF9\u2026 che",text:"On utilise <b>che</b> (et non di) quand on compare deux adjectifs, deux verbes, ou devant une pr\xE9position.",examples:[["\xC8 pi\xF9 bello che utile.","C'est plus beau qu'utile."],["Mi piace pi\xF9 leggere che guardare la TV.","J'aime plus lire que regarder la t\xE9l\xE9."],["Fa pi\xF9 caldo a Napoli che a Milano.","Il fait plus chaud \xE0 Naples qu'\xE0 Milan."]]},{title:"Le superlatif et les irr\xE9guliers",text:"<b>il / la pi\xF9</b> + adjectif (+ <b>di</b>) = le plus\u2026 de. Irr\xE9guliers fr\xE9quents : buono \u2192 <b>migliore</b> (meilleur), cattivo \u2192 <b>peggiore</b> (pire). Superlatif absolu : <b>-issimo</b> (bellissimo = tr\xE8s beau).",examples:[["\xC8 il ristorante pi\xF9 famoso della citt\xE0.","C'est le restaurant le plus c\xE9l\xE8bre de la ville."],["La pizza napoletana \xE8 la migliore!","La pizza napolitaine est la meilleure !"],["Il tiramis\xF9 \xE8 buonissimo.","Le tiramisu est tr\xE8s tr\xE8s bon."]]}],mnemo:"Pi\xF9 DI devant un nom ou un pronom (pi\xF9 alto DI te), pi\xF9 CHE devant tout le reste (adjectif, verbe, pr\xE9position).",vocab:[["pi\xF9","plus"],["meno","moins"],["come","comme, aussi\u2026 que"],["migliore","meilleur"],["peggiore","pire"],["alto","grand (taille)"],["basso","petit (taille)"],["caro","cher"],["famoso","c\xE9l\xE8bre"],["utile","utile"],["bellissimo","magnifique"],["l'aereo","l'avion"]],quiz:[le("Milano \xE8 pi\xF9 grande ___ Bologna.",["di"],"pi\xF9 + adjectif + di + nom."),H("\xAB Le train est moins cher que l'avion \xBB :",["Il treno \xE8 meno caro che l'aereo.","Il treno \xE8 meno caro dell'aereo.","Il treno \xE8 pi\xF9 caro dell'aereo.","Il treno \xE8 meno caro di aereo."],1,"di + l' = dell'."),H("Mi piace pi\xF9 nuotare ___ correre.",["di","che","come","del"],1,"Deux verbes : pi\xF9\u2026 che."),le("Questo vino \xE8 buono, ma quello \xE8 ___. (meilleur)",["migliore"],"buono \u2192 migliore."),H("\xAB Tr\xE8s beau \xBB (une seule forme) :",["molto bellissimo","bellissimo","pi\xF9 bello","il pi\xF9 bello"],1,"-issimo = tr\xE8s."),H("\xAB Luca est aussi grand que son p\xE8re \xBB :",["Luca \xE8 alto come suo padre.","Luca \xE8 alto che suo padre.","Luca \xE8 pi\xF9 alto come suo padre.","Luca \xE8 tanto alto di suo padre."],0,"(cos\xEC) alto come."),Ve("Associez",[["migliore","meilleur"],["peggiore","pire"],["meno","moins"],["famoso","c\xE9l\xE8bre"]]),Re("Traduisez : C'est le plus beau jour de l'ann\xE9e.",["\xE8 il giorno pi\xF9 bello dell'anno","e il giorno piu bello dell'anno"],"il + nom + pi\xF9 + adjectif + di.")]},{id:"a2-imperativo",module:"conj",title:"Donner des conseils et des instructions : l'imp\xE9ratif",emoji:"\u{1F468}\u200D\u{1F373}",intro:"Recettes, directions, conseils entre amis : l'imp\xE9ratif avec tu, noi et voi, et sa n\xE9gation un peu particuli\xE8re.",sections:[{title:"Imp\xE9ratif avec tu, noi, voi",text:"Verbes en <b>-are</b> : tu \u2192 <b>-a</b> (parla!), voi \u2192 <b>-ate</b>. Verbes en <b>-ere / -ire</b> : tu \u2192 <b>-i</b> (prendi! senti!). Noi et voi = comme le pr\xE9sent (andiamo! venite!).",table:{cols:["","tu","noi","voi"],rows:[["guardare","guarda!","guardiamo!","guardate!"],["prendere","prendi!","prendiamo!","prendete!"],["aprire","apri!","apriamo!","aprite!"],["finire","finisci!","finiamo!","finite!"]]}},{title:"Les irr\xE9guliers \xE0 conna\xEEtre",text:"andare \u2192 <b>va'</b> \xB7 fare \u2192 <b>fa'</b> \xB7 dare \u2192 <b>da'</b> \xB7 stare \u2192 <b>sta'</b> \xB7 dire \u2192 <b>di'</b> \xB7 essere \u2192 <b>sii</b> \xB7 avere \u2192 <b>abbi</b>. Avec un pronom, la consonne double : <i>fammi vedere</i>, <i>dimmi</i>.",examples:[["Dimmi la verit\xE0!","Dis-moi la v\xE9rit\xE9 !"],["Fammi vedere!","Fais-moi voir !"],["Va' dritto e gira a sinistra.","Va tout droit et tourne \xE0 gauche."]]},{title:"La n\xE9gation avec tu : non + infinitif",text:"\xC0 la 2e personne du singulier, l'imp\xE9ratif n\xE9gatif = <b>non + infinitif</b>. Pour noi et voi, on met simplement non devant.",examples:[["Non toccare!","Ne touche pas !"],["Non preoccuparti!","Ne t'inqui\xE8te pas !"],["Non dimenticate i passaporti!","N'oubliez pas les passeports !"],["Aggiungi il sale e mescola bene.","Ajoute le sel et m\xE9lange bien."]]}],mnemo:"Imp\xE9ratif tu des verbes en -are : inversion de la voyelle ! Au pr\xE9sent \xAB tu parli \xBB, \xE0 l'imp\xE9ratif \xAB parla! \xBB. Et en n\xE9gatif, on repasse \xE0 l'infinitif : non parlare!",vocab:[["guardare","regarder"],["aggiungere","ajouter"],["mescolare","m\xE9langer"],["il sale","le sel"],["toccare","toucher"],["dimenticare","oublier"],["preoccuparsi","s'inqui\xE9ter"],["la verit\xE0","la v\xE9rit\xE9"],["il passaporto","le passeport"],["attento","attentif (attento! = attention !)"],["sbrigarsi","se d\xE9p\xEAcher"],["la ricetta","la recette"]],quiz:[H("Imp\xE9ratif de \xAB mangiare \xBB (tu) :",["mangi!","mangia!","mangiare!","mangiate!"],1,"-are \u2192 -a avec tu."),H("\xAB Ne touche pas ! \xBB :",["Non tocca!","Non toccare!","Non tocchi!","Tocca non!"],1,"N\xE9gation avec tu : non + infinitif."),le("___ la finestra, per favore! (aprire, tu)",["apri"],"-ire \u2192 -i : apri!"),H("\xAB Dis-moi ! \xBB :",["Dici mi!","Dimmi!","D\xEC me!","Dica mi!"],1,"di' + mi \u2192 dimmi (consonne doubl\xE9e)."),le("Ragazzi, ___ attenzione! (fare, voi)",["fate"],"voi : fate."),H("\xAB Ne t'inqui\xE8te pas ! \xBB :",["Non ti preoccupa!","Non preoccuparti!","Non preoccupati!","Preoccupati non!"],1,"non + infinitif + pronom attach\xE9 : non preoccuparti."),Ve("Associez",[["aggiungere","ajouter"],["mescolare","m\xE9langer"],["dimenticare","oublier"],["sbrigarsi","se d\xE9p\xEAcher"]]),Re("Traduisez : Allons-y !",["andiamo","andiamo!"],"noi : andiamo!")]},{id:"a2-ci-ne",module:"gram",title:"Ci et ne : \xAB y \xBB et \xAB en \xBB",emoji:"\u{1F501}",intro:"Deux petits mots tr\xE8s fr\xE9quents \xE0 l'oral : \xAB ci vado \xBB (j'y vais), \xAB ne voglio due \xBB (j'en veux deux).",sections:[{title:"Ci = y (lieu)",text:"<b>ci</b> remplace un lieu d\xE9j\xE0 mentionn\xE9. Expressions fixes : <b>ci vuole / ci vogliono</b> = il faut (du temps, des choses).",examples:[["Vai a Roma? \u2014 S\xEC, ci vado domani.","Tu vas \xE0 Rome ? \u2014 Oui, j'y vais demain."],["Sei mai stato in Sicilia? \u2014 No, non ci sono mai stato.","Tu es d\xE9j\xE0 all\xE9 en Sicile ? \u2014 Non, je n'y suis jamais all\xE9."],["Ci vogliono due ore in treno.","Il faut deux heures en train."]]},{title:"Ne = en (quantit\xE9)",text:"<b>ne</b> remplace une quantit\xE9 ou \xAB de cela \xBB. On garde le nombre ou la quantit\xE9 dans la phrase. Au pass\xE9 compos\xE9, le participe s'accorde avec ce que remplace ne.",examples:[["Quante mele vuoi? \u2014 Ne voglio tre.","Combien de pommes veux-tu ? \u2014 J'en veux trois."],["Hai fratelli? \u2014 S\xEC, ne ho due.","Tu as des fr\xE8res ? \u2014 Oui, j'en ai deux."],["Che ne pensi?","Qu'en penses-tu ?"],["Quante pizze hai mangiato? \u2014 Ne ho mangiate due.","Combien de pizzas as-tu mang\xE9 ? \u2014 J'en ai mang\xE9 deux."]]},{title:"Au march\xE9",examples:[["Vorrei dei pomodori. \u2014 Quanti ne vuole?","Je voudrais des tomates. \u2014 Combien en voulez-vous ?"],["Ne prendo un chilo.","J'en prends un kilo."],["Un etto di prosciutto, per favore.","Cent grammes de jambon, s'il vous pla\xEEt."]]}],mnemo:"CI comme \xAB ici \xBB (un lieu), NE comme \xAB nombre \xBB (une quantit\xE9).",vocab:[["ci","y (lieu)"],["ne","en (quantit\xE9)"],["ci vuole","il faut (sing.)"],["ci vogliono","il faut (plur.)"],["mai","jamais"],["pensare","penser"],["il pomodoro","la tomate"],["il chilo","le kilo"],["l'etto","cent grammes"],["il prosciutto","le jambon"],["il mercato","le march\xE9"],["quanti","combien (plur.)"]],quiz:[H("Vai al cinema stasera? \u2014 S\xEC, ___ vado con Luca.",["ne","ci","lo","gli"],1,"ci = y (lieu)."),H("Quanti caff\xE8 bevi al giorno? \u2014 ___ bevo tre.",["Ci","Ne","Li","Lo"],1,"ne = en (quantit\xE9)."),le("Che ___ pensi? (en)",["ne"],"Che ne pensi? = Qu'en penses-tu ?"),H("\xAB Il faut trois heures \xBB :",["Ci vuole tre ore.","Ci vogliono tre ore.","Ne vogliono tre ore.","Bisogna tre ore."],1,"Pluriel : ci vogliono."),H("\xAB Un etto \xBB correspond \xE0 :",["un kilo","cent grammes","un litre","dix grammes"],1,"un etto = 100 g, tr\xE8s utilis\xE9 au march\xE9."),le("Hai sorelle? \u2014 S\xEC, ___ ho una.",["ne"],"ne ho una = j'en ai une."),Ve("Associez",[["il pomodoro","la tomate"],["il prosciutto","le jambon"],["il mercato","le march\xE9"],["mai","jamais"]]),Re("Traduisez : J'y vais demain.",["ci vado domani","domani ci vado","io ci vado domani"],"Ci vado domani.")]},{id:"a2-condizionale",module:"expr",title:"Demander poliment : vorrei, potrei, mi piacerebbe",emoji:"\u{1F3A9}",intro:"Le conditionnel de politesse sert partout au quotidien : commander, demander un service, exprimer un souhait, donner un conseil.",sections:[{title:"Les formes les plus utiles",text:"On les apprend comme des expressions : <b>vorrei</b> (je voudrais), <b>potrei</b> (pourrais-je), <b>potrebbe</b> (pourriez-vous), <b>mi piacerebbe</b> (j'aimerais), <b>dovresti</b> (tu devrais), <b>sarebbe</b> (ce serait).",examples:[["Vorrei un cappuccino, per favore.","Je voudrais un cappuccino, s'il vous pla\xEEt."],["Potrebbe ripetere, per favore?","Pourriez-vous r\xE9p\xE9ter, s'il vous pla\xEEt ?"],["Potrei avere il conto?","Pourrais-je avoir l'addition ?"]]},{title:"Souhaits et conseils",examples:[["Mi piacerebbe visitare Venezia.","J'aimerais visiter Venise."],["Dovresti dormire di pi\xF9.","Tu devrais dormir plus."],["Sarebbe bello andare al mare.","Ce serait bien d'aller \xE0 la mer."],["Ti andrebbe di uscire stasera?","\xC7a te dirait de sortir ce soir ?"]]},{title:"Conjugaison (verbes r\xE9guliers)",text:"Infinitif sans -e (et -are \u2192 -er) + <b>-ei, -esti, -ebbe, -emmo, -este, -ebbero</b> : parlerei, prenderei, dormirei. Radicaux irr\xE9guliers : volere \u2192 <b>vorr-</b>, potere \u2192 <b>potr-</b>, dovere \u2192 <b>dovr-</b>, andare \u2192 <b>andr-</b>, essere \u2192 <b>sar-</b>, avere \u2192 <b>avr-</b>."}],mnemo:"\xAB Vorrei \xBB commence comme \xAB vouloir \xBB et finit en -ei comme \xAB je \xBB : c'est LE mot magique du voyageur.",vocab:[["vorrei","je voudrais"],["potrei","je pourrais"],["potrebbe","pourriez-vous"],["mi piacerebbe","j'aimerais"],["dovresti","tu devrais"],["sarebbe","ce serait"],["ripetere","r\xE9p\xE9ter"],["visitare","visiter"],["il favore","le service, la faveur"],["volentieri","volontiers"],["magari","peut-\xEAtre, si seulement"],["ti andrebbe di\u2026?","\xE7a te dirait de\u2026 ?"]],quiz:[H("Pour commander poliment :",["Voglio un caff\xE8.","Vorrei un caff\xE8.","Volerei un caff\xE8.","Volessi un caff\xE8."],1,"vorrei = je voudrais."),le("___ ripetere, per favore? (pourriez-vous)",["potrebbe"],"Potrebbe (vouvoiement)."),H("\xAB J'aimerais voyager \xBB :",["Mi piace viaggiare.","Mi piacerebbe viaggiare.","Mi piacerei viaggiare.","Piacerei viaggiare."],1,"mi piacerebbe + infinitif."),le("Sei stanco: ___ riposarti. (tu devrais)",["dovresti"],"dovresti = tu devrais."),H("Ti andrebbe di andare al cinema? R\xE9ponse positive :",["Volentieri!","Magari no.","Non vorrei.","Prego."],0,"Volentieri = volontiers."),H("Conditionnel de \xAB parlare \xBB (io) :",["parlarei","parlerei","parler\xF2","parlassi"],1,"-are \u2192 -er- : parlerei."),Ve("Associez",[["sarebbe","ce serait"],["volentieri","volontiers"],["magari","si seulement"],["potrei","je pourrais"]]),Re("Traduisez : Je voudrais l'addition.",["vorrei il conto","vorrei il conto per favore"],"Vorrei il conto.")]},{id:"a2-casa",module:"vocab",title:"La maison et chercher un logement",emoji:"\u{1F3E0}",intro:"D\xE9crire son appartement, lire une annonce, parler du loyer : la situation typique d'un s\xE9jour en Italie.",sections:[{title:"Les pi\xE8ces et les meubles",examples:[["la cucina / il soggiorno","la cuisine / le s\xE9jour"],["la camera da letto / il bagno","la chambre / la salle de bain"],["il divano / l'armadio","le canap\xE9 / l'armoire"],["il tavolo / la sedia","la table / la chaise"],["il frigorifero / la lavatrice","le frigo / la machine \xE0 laver"]]},{title:"Lire une annonce",text:"<b>affittasi</b> = \xE0 louer \xB7 <b>bilocale</b> = deux pi\xE8ces \xB7 <b>arredato</b> = meubl\xE9 \xB7 <b>spese incluse</b> = charges comprises \xB7 <b>piano</b> = \xE9tage (<i>al terzo piano</i>) \xB7 <b>l'affitto</b> = le loyer.",examples:[["Affittasi bilocale arredato in centro, 650 euro al mese.","\xC0 louer : deux-pi\xE8ces meubl\xE9 au centre, 650 euros par mois."],["Le spese sono incluse?","Les charges sont comprises ?"],["L'appartamento \xE8 al secondo piano, senza ascensore.","L'appartement est au deuxi\xE8me \xE9tage, sans ascenseur."]]},{title:"D\xE9crire",examples:[["La mia camera \xE8 piccola ma luminosa.","Ma chambre est petite mais lumineuse."],["Abito con due coinquilini.","J'habite avec deux colocataires."],["Il bagno \xE8 in fondo al corridoio.","La salle de bain est au bout du couloir."]]}],mnemo:"BI-locale = 2 pi\xE8ces, TRI-locale = 3 pi\xE8ces, MONO-locale = studio. Les Italiens comptent les pi\xE8ces sans la cuisine ni la salle de bain\u2026 parfois !",vocab:[["l'appartamento","l'appartement"],["la cucina","la cuisine"],["il soggiorno","le s\xE9jour"],["la camera da letto","la chambre"],["il bagno","la salle de bain"],["il divano","le canap\xE9"],["l'armadio","l'armoire"],["la sedi osso provare questa giacca?","Je peux essayer cette veste ?"],["Che taglia porta? \u2014 La 42.","Quelle taille faites-vous ? \u2014 Du 42."],["Che numero porta? \u2014 Il 39.","Vous chaussez du combien ? \u2014 Du 39."],["Mi sta un po' stretta. Ce l'ha pi\xF9 grande?","Elle me serre un peu. Vous l'avez plus grande ?"],["Quanto costa? \u2014 \xC8 in saldo: 30 euro.","Combien \xE7a co\xFBte ? \u2014 C'est en solde : 30 euros."],["Posso pagare con la carta?","Je peux payer par carte ?"]]},{title:"Questo / quello",text:"<b>questo</b> (ce\u2026-ci, proche) et <b>quello</b> (ce\u2026-l\xE0, loin). <i>Quello</i> change de forme comme l'article : quel vestito, quello zaino, quell'abito, quei pantaloni, quegli stivali, quella gonna."}],mnemo:"TAGLIA pour les v\xEAtements (on \xAB taille \xBB le tissu), NUMERO pour les chaussures.",vocab:[["la maglietta","le t-shirt"],["la camicia","la chemise"],["i pantaloni","le pantalon"],["la gonna","la jupe"],["la giacca","la veste"],["il maglione","le pull"],["il cappotto","le manteau"],["la taglia","la taille (v\xEAtement)"],["il numero","la pointure, le num\xE9ro"],["provare","essayer"],["stretto","serr\xE9, \xE9troit"],["largo","large"],["i saldi","les soldes"],["lo sconto","la r\xE9duction"],["la carta","la carte (bancaire)"]],quiz:[H("Pour les chaussures, on demande :",["Che taglia porta?","Che numero porta?","Che misura \xE8?","Quanto porta?"],1,"numero pour les chaussures."),le("Posso ___ questi pantaloni? (essayer)",["provare"],"provare = essayer."),H("\xAB Mi sta stretta \xBB signifie :",["Elle me va bien","Elle me serre","Elle est trop longue","Elle est trop ch\xE8re"],1,"stretto = serr\xE9."),H("\xAB Quei pantaloni \xBB : pourquoi \xAB quei \xBB ?",["parce que c'est f\xE9minin","c'est un masculin pluriel commen\xE7ant par une consonne","c'est une faute","parce que c'est un objet proche"],1,"quello suit l'article : i pantaloni \u2192 quei pantaloni."),Ve("Associez",[["la gonna","la jupe"],["il maglione","le pull"],["il cappot ana prossima.","J'ai un examen la semaine prochaine."],["Sto facendo uno stage in un'azienda italiana.","Je fais un stage dans une entreprise italienne."]]},{title:"Les projets : pensare di, avere intenzione di",text:"<b>pensare di</b> + infinitif = penser (\xE0) faire \xB7 <b>avere intenzione di</b> = avoir l'intention de \xB7 <b>sperare di</b> = esp\xE9rer.",examples:[["Penso di cercare lavoro in Italia.","Je pense chercher du travail en Italie."],["Spero di trovare uno stage a Milano.","J'esp\xE8re trouver un stage \xE0 Milan."],["L'anno prossimo ho intenzione di imparare il cinese.","L'ann\xE9e prochaine, j'ai l'intention d'apprendre le chinois."]]}],mnemo:"Fare + article (faccio IL medico), essere sans article (sono medico). Les deux sont corrects !",vocab:[["il lavoro","le travail"],["l'azienda","l'entreprise"],["l'ufficio","le bureau"],["il collega","le coll\xE8gue"],["lo stipendio","le salaire"],["l'universit\xE0","l'universit\xE9"],["l'esame","l'examen"],["lo stage","le stage"],["la laurea","le dipl\xF4me universitaire"],["cercare lavoro","chercher du travail"],["sperare","esp\xE9rer"],["prossimo","prochain"],["l'insegnante","l'enseignant(e)"],["il cameriere","le serveur"]],quiz:[H("\xAB Quel est ton m\xE9tier ? \xBB :",["Che lavoro fai?","Cosa lavori?","Quale lavoro sei?","Come lavori?"],0,"Che lavoro fai?"),H("Forme correcte :",["Faccio medico.","Faccio il medico.","Sono il medico.","Ho il medico."],1,"fare + article : faccio il medico."),le("Spero ___ trovare un lavoro. (de)",["di"],"sperare di + infinitif."),le("Ho un ___ domani all'universit\xE0. (examen)",["esame"],"l'esame."),Ve("Associez",[["lo stipendio","le salaire"],["l'azienda","l'entreprise"],["il collega","le coll\xE8gue"],["la laurea","le dipl\xF4me"]]),H("\xAB La semaine prochaine \xBB :",["la settimana scorsa","la settimana prossima","la prossima volta","fra settimana"],1,"prossimo = prochain."),H("\xAB Avere intenzione di \xBB =",["avoir besoin de","avoir l'intention de","avoir envie de"," ,Be,Se,Dl,Ja,Gn,xs,Xn,zs=at(()=>{gs();ys();N=(e,a,t,n="")=>({type:"mcq",q:e,options:a,answer:t,explain:n}),ae=(e,a,t="")=>({type:"fill",q:e,answer:a,explain:t}),Be=(e,a,t="")=>({type:"match",q:e,pairs:a,explain:t}),Se=(e,a,t="")=>({type:"translate",q:e,answer:a,explain:t}),Dl={bases:{label:"Bases",icon:"\u{1F524}"},vocab:{label:"Vocabulaire",icon:"\u{1F4DA}"},gram:{label:"Grammaire",icon:"\u{1F9E9}"},conj:{label:"Conjugaison",icon:"\u23F3"},nombres:{label:"Nombres",icon:"\u{1F522}"},expr:{label:"Expressions",icon:"\u{1F4AC}"}},Ja=[{id:"A1",name:"D\xE9butant",title:"Les premiers pas",emoji:"\u{1F331}",color:"#1e8e5a",desc:"Alphabet, salutations, chiffres et verbes essentiels.",lessons:[{id:"a1-alfabeto",module:"bases",title:"L'alphabet et la prononciation",emoji:"\u{1F524}",intro:"Bonne nouvelle : l'italien se lit presque toujours comme il s'\xE9crit. Quelques r\xE8gles suffisent pour tout prononcer correctement.",sections:[{title:"21 lettres seulement",text:"L'alphabet italien compte <b>21 lettres</b>. J, K, W, X et Y n'apparaissent que dans les mots \xE9trangers (<i>jeans, kiwi, taxi</i>). Toutes les lettres se prononcent, y compris le <b>e</b> final.",examples:[["ciao","salut \u2014 \xAB tchao \xBB"],["pane","pain \u2014 \xAB pan\xE9 \xBB"],["amore","amour \u2014 \xAB amor\xE9 \xBB"]]},{title:"C et G : doux ou durs ?",text:"Devant <b>E</b> et <b>I</b>, C se prononce \xAB tch \xBB et G \xAB dj \xBB. Devant A, O, U, ils sont durs. Pour les durcir devant E/I, on glisse un <b>H</b> : CHE = \xAB k\xE9 \xBB, GHI = \xAB gui \xBB.",examples:[["cena","d\xEEner \u2014 \xAB tch\xE9na \xBB"],["gelato","glace \u2014 \xAB dj\xE9lato \xBB"],["chiesa","\xE9glise \u2014 \xAB ki\xE9za \xBB"],["spaghetti","spaghettis \u2014 \xAB spagu\xE9tti \xBB"]]},{title:"Les sons sp\xE9ciaux",text:"<b>GLI</b> \u2248 \xAB lli \xBB mouill\xE9 \xB7 <b>GN</b> comme en fran\xE7ais \xB7 <b>SCI/SCE</b> = \xAB ch \xBB \xB7 le <b>R</b> est roul\xE9 \xB7 les <b>doubles consonnes</b> s'appuient (pala \u2260 palla).",examples:[["famiglia","famille"],["gnocchi","gnocchis"],["pesce","poisson \u2014 \xAB p\xE9ch\xE9 \xBB"],["nonno","grand-p\xE8re (n appuy\xE9)"]]}],mnemo:"Le H italien ne se prononce jamais : c'est un \xAB bouclier \xBB qui garde C et G durs. Pensez au vin \xAB CHIanti \xBB = \xAB kianti \xBB.",vocab:[["ciao","salut / au revoir"],["grazie","merci"],["prego","je vous en prie"],["s\xEC","oui"],["no","non"],["per favore","s'il vous pla\xEEt"],["scusa","pardon (tu)"]],quiz:[N("Comment se prononce \xAB cena \xBB ?",["\xAB k\xE9na \xBB","\xAB tch\xE9na \xBB","\xAB s\xE9na \xBB","\xAB ch\xE9na \xBB"],1,"Devant E et I, le C se prononce \xAB tch \xBB."),N("Quelle orthographe donne le son \xAB k\xE9 \xBB ?",["ce","che","cie","qe"],1,"Le H durcit le C devant E et I : CHE = \xAB k\xE9 \xBB."),Be("Associez chaque mot \xE0 sa traduction",[["grazie","merci"],["prego","je vous en prie"],["s\xEC","oui"],["per favore","s'il vous pla\xEEt"]]),N("Combien de lettres compte l'alphabet italien ?",["26","21","24","19"],1,"21 lettres : J, K, W, X, Y sont r\xE9serv\xE9es aux mots \xE9trangers."),Se("Traduisez : merci",["grazie"],"\xAB Merci \xBB se dit grazie (\xAB gra-tsi\xE9 \xBB).")]},{id:"a1-saluti",module:"expr",title:"Saluer et se pr\xE9senter",emoji:"\u{1F44B}",intro:"Les premiers mots de toute conversation : dire bonjour au bon moment, se pr\xE9senter, et choisir entre \xAB tu \xBB et \xAB vous \xBB.",sections:[{title:"Dire bonjour selon le moment",text:"<b>Buongiorno</b> le matin et l'apr\xE8s-midi, <b>buonasera</b> \xE0 partir de 17 h environ, <b>buonanotte</b> seulement en allant se coucher. <b>Ciao</b> est informel (bonjour ET au revoir), <b>salve</b> est neutre et poli.",examples:[["Buongiorno, signora!","Bonjour, madame !"],["Buonasera a tutti.","Bonsoir \xE0 tous."],["Arrivederci!","Au revoir !"]]},{title:"Se pr\xE9senter",text:"On utilise le verbe pronominal <b>chiamarsi</b> (s'appeler).",examples:[["Come ti chiami?","Comment t'appelles-tu ?"],["Mi chiamo Marco.","Je m'appelle Marco."],["Piacere!","Enchant\xE9(e) !"],["Di dove sei? \u2014 Sono francese.","D'o\xF9 es-tu ? \u2014 Je suis fran\xE7ais(e)."]]},{title:"Tu ou Lei ?",text:"Le vouvoiement italien utilise <b>Lei</b> (\xAB elle \xBB) + le verbe \xE0 la <b>3e personne</b>, m\xEAme pour un homme.",examples:[["Come stai?","Comment vas-tu ?"],["Come sta?","Comment allez-vous ?"],["Bene, grazie. E Lei?","Bien, merci. Et vous ?"]]}],mnemo:"\xAB Lei \xBB, c'est comme parler \xE0 Sa Majest\xE9 : on s'adresse \xE0 la personne \xE0 la 3e personne, par respect.",vocab:[["buongiorno","bonjour"],["buonasera","bonsoir"],["buonanotte","bonne nuit"],["arrivederci","au revoir"],["salve","bonjour (neutre)"],["piacere","enchant\xE9(e)"],["come stai?","comment vas-tu ?"],["bene","bien"]],quiz:[N("Il est 20 h, vous entrez dans un restaurant. Vous dites :",["Buongiorno","Buonanotte","Buonasera","Arrivederci"],2,"Buonasera s'utilise \xE0 partir de la fin d'apr\xE8s-midi. Buonanotte se dit seulement en allant se coucher."),ae("Ciao! Mi ___ Marco.",["chiamo"],"Mi chiamo = je m'appelle (verbe chiamarsi)."),N("Comment demander poliment \xAB Comment allez-vous ? \xBB \xE0 un inconnu ?",["Come stai?","Come sta?","Come stanno?","Come state?"],1,"Avec le vouvoiement (Lei), on conjugue \xE0 la 3e personne du singulier : Come sta?"),Be("Associez chaque mot \xE0 sa traduction",[["arrivederci","au revoir"],["piacere","enchant\xE9(e)"],["buonanotte","bonne nuit"],["salve","bonjour (neutre)"]]),Se("Traduisez : Je suis fran\xE7ais.",["sono francese","io sono francese"],"Sono francese \u2014 le pronom \xAB io \xBB est g\xE9n\xE9ralement omis. Francese est identique au masculin et au f\xE9minin.")]},{id:"a1-numeri",module:"nombres",title:"Les chiffres et les nombres",emoji:"\u{1F522}",intro:"Compter de 0 \xE0 1000, payer, donner son \xE2ge ou son num\xE9ro : les nombres italiens sont tr\xE8s logiques.",sections:[{title:"De 0 \xE0 10",text:"\xC0 apprendre par c\u0153ur : ce sont les briques de tous les autres nombres.",table:{cols:["","","",""],rows:[["0 zero","1 uno","2 due","3 tre"],["4 quattro","5 cinque","6 sei","7 sette"],["8 otto","9 nove","10 dieci",""]]}},{title:"De 11 \xE0 20",text:"De 11 \xE0 16, l'unit\xE9 vient <b>avant</b> (-dici). \xC0 partir de 17, elle vient <b>apr\xE8s</b> (dicia-).",table:{cols:["","","","",""],rows:[["11 undici","12 dodici","13 tredici","14 quattordici","15 quindici"],["16 sedici","17 diciassette","18 diciotto","19 diciannove","20 venti"]]}},{title:"Dizaines, centaines, milliers",text:"venti, trenta, quaranta, cinquanta, sessanta, settanta, ottanta, novanta, <b>cento</b>, <b>mille</b> (pluriel : <i>mila</i>). La dizaine perd sa voyelle devant <b>uno</b> et <b>otto</b>. Tre final prend un accent : <i>ventitr\xE9</i>.",examples:[["ventuno","21"],["ventotto","28"],["trentatr\xE9","33"],["centocinquanta","150"],["duemilaventisei","2026"]]}],mnemo:"17-19 : \xAB dicia- \xBB = \xAB dix-et- \xBB \u2192 diciassette, diciotto, diciannove suivent exactement l'ordre fran\xE7ais dix-sept, dix-huit, dix-neuf.",vocab:[["uno","un"],["dieci","dix"],["venti","vingt"],["cento","cent"],["mille","mille"],["quanto costa?","combien \xE7a co\xFBte ?"]],quiz:[N("Comment dit-on 15 ?",["cinquedici","quindici","quindieci","quinze"],1,"15 = quindici (de 11 \xE0 16, l'unit\xE9 se place avant -dici)."),ae("20 + 1 = ___ (en lettres)",["ventuno"],"Devant uno et otto, la dizaine perd sa voyelle : venti \u2192 ventuno."),N("Que signifie \xAB diciotto \xBB ?",["16","17","18","19"],2,"Dicia- + otto = dix-huit."),Be("Associez chaque nombre",[["trenta","30"],["cinquanta","50"],["settanta","70"],["novanta","90"]]),Se("\xC9crivez en lettres : 28",["ventotto"],"Venti + otto \u2192 ventotto (le i tombe devant otto).")]},{id:"a1-essere-avere",module:"conj",title:"Les verbes essere et avere",emoji:"\u23F3",intro:"\xCAtre et avoir : les deux verbes les plus utilis\xE9s, indispensables pour former tous les temps compos\xE9s.",sections:[{title:"Essere (\xEAtre)",text:"Les pronoms sujets sont souvent omis : la terminaison suffit. Attention : <b>\xE8</b> (il est) \u2260 <b>e</b> (et).",table:{cols:["Pronom","Essere"],rows:[["io","sono"],["tu","sei"],["lui / lei / Lei","\xE8"],["noi","siamo"],["voi","siete"],["loro","sono"]]}},{title:"Avere (avoir)",text:"Le <b>h</b> ne se prononce pas : il distingue <i>ho</i> (j'ai) de <i>o</i> (ou), <i>ha</i> de <i>a</i> (\xE0), <i>hanno</i> de <i>anno</i> (ann\xE9e).",table:{cols:["Pronom","Avere"],rows:[["io","ho"],["tu","hai"],["lui / lei / Lei","ha"],["noi","abbiamo"],["voi","avete"],["loro","hanno"]]}},{title:"Expressions avec avere",text:"Comme en fran\xE7ais, on \xAB a \xBB faim, soif, froid\u2026 et son \xE2ge.",examples:[["Ho fame.","J'ai faim."],["Hai sete?","Tu as soif ?"],["Ho vent'anni.","J'ai vingt ans."],["Quanti anni hai?","Quel \xE2ge as-tu ?"]]}],mnemo:"Le h muet de ho, hai, ha, hanno sert uniquement \xE0 les distinguer de o (ou), ai (aux), a (\xE0) et anno (ann\xE9e).",vocab:[["essere","\xEAtre"],["avere","avoir"],["la fame","la faim"],["la sete","la soif"],["l'anno","l'ann\xE9e"],["stanco","fatigu\xE9"],["contento","content"]],quiz:[ae("Noi ___ italiani. (essere)",["siamo"],"Essere, 1re personne du pluriel : siamo."),ae("Loro ___ una macchina rossa. (avere)",["hanno"],"Avere \xE0 la 3e personne du pluriel : hanno. Una macchina = une voiture."),N("Quelle phrase signifie \xAB J'ai soif \xBB ?",["Sono sete","Ho sete","Ho la sete","Ha sete"],1,"Comme en fran\xE7ais, on utilise avere : ho sete."),N("Lequel signifie \xAB il est \xBB ?",["e","\xE8","ha","hai"],1,"\xE8 avec accent = il/elle est ; e sans accent = et."),Se("Traduisez : Tu as vingt ans.",["hai venti anni","tu hai venti anni","hai vent'anni","tu hai vent'anni"],"Hai vent'anni (ou venti anni). L'\xE9lision \xAB vent'anni \xBB est tr\xE8s courante.")]},{id:"a1-articoli",module:"gram",title:"Le genre et les articles",emoji:"\u{1F9E9}",intro:"En italien, chaque nom a un genre, et l'article change selon la premi\xE8re lettre du mot. Une seule r\xE8gle \xE0 comprendre !",sections:[{title:"Masculin, f\xE9minin, pluriel",text:"Noms en <b>-o</b> \u2192 g\xE9n\xE9ralement masculins ; en <b>-a</b> \u2192 f\xE9minins ; en <b>-e</b> \u2192 les deux. Pluriel : -o \u2192 <b>-i</b>, -a \u2192 <b>-e</b>, -e \u2192 <b>-i</b>.",examples:[["il ragazzo \u2192 i ragazzi","le gar\xE7on \u2192 les gar\xE7ons"],["la ragazza \u2192 le ragazze","la fille \u2192 les filles"],["il fiore \u2192 i fiori","la fleur \u2192 les fleurs"]]},{title:"L'article d\xE9fini",text:"Au masculin, l'article d\xE9pend du son qui suit.",table:{cols:["Devant\u2026","Singulier","Pluriel"],rows:[["consonne (m.)","il treno","i treni"],["s+consonne, z, gn, ps (m.)","lo studente","gli studenti"],["voyelle (m.)","l'amico","gli amici"],["consonne (f.)","la pizza","le pizze"],["voyelle (f.)","l'amica","le amiche"]]}},{title:"L'article ind\xE9fini",text:"<b>un</b> (masc.), <b>uno</b> (masc. devant s+consonne, z\u2026), <b>una</b> (f\xE9m.), <b>un'</b> (f\xE9m. devant voyelle).",examples:[["un caff\xE8","un caf\xE9"],["uno zio","un oncle"],["una birra","une bi\xE8re"],["un'amica","une amie"]]}],mnemo:"\xAB Lo \xBB et \xAB uno \xBB sont les articles des mots difficiles \xE0 prononcer : S+consonne, Z, GN, PS. Lo studente, lo zucchero, uno psicologo.",vocab:[["il libro","le livre"],["la casa","la maison"],["lo studente","l'\xE9tudiant"],["l'amico","l'ami"],["la ragazza","la fille"],["lo zaino","le sac \xE0 dos"],["il caff\xE8","le caf\xE9"]],quiz:[N("___ zaino",["il","lo","la","l'"],1,"Zaino commence par z \u2192 lo zaino."),N("Pluriel de \xAB l'amico \xBB :",["i amici","gli amici","le amici","li amici"],1,"Le pluriel de lo et de l' (masculin) est gli."),ae("Vorrei ___ birra, per favore.",["una"],"Birra est f\xE9minin et commence par une consonne \u2192 una."),Be("Associez singulier et pluriel",[["il treno","i treni"],["la pizza","le pizze"],["lo studente","gli studenti"],["il fiore","i fiori"]]),N("Quel article pour \xAB amica \xBB (une amie) ?",["un","uno","una","un'"],3,"F\xE9minin devant voyelle : un' avec apostrophe. Au masculin, pas d'apostrophe : un amico.")]}],exam:[N("Comment se prononce \xAB gelato \xBB ?",["\xAB gu\xE9lato \xBB","\xAB dj\xE9lato \xBB","\xAB j\xE9lato \xBB","\xAB kh\xE9lato \xBB"],1,"G devant E = \xAB dj \xBB."),ae("Tu ___ stanco? (essere)",["sei"],"Essere, 2e personne : sei."),N("___ studenti",["i","gli","le","lo"],1,"Studente commence par s+consonne \u2192 lo studente, gli studenti."),Se("Traduisez : Bonsoir",["buonasera"],"Buonasera, \xE0 partir de la fin d'apr\xE8s-midi."),ae("30 + 3 = ___ (en lettres)",["trentatr\xE9"],"Trentatr\xE9, avec un accent sur le e final."),N("Comment dit-on \xAB J'ai faim \xBB ?",["Sono fame","Ho fame","Ho la fama","Ha fame"],1,"Avere fame : ho fame."),Be("Associez",[["buongiorno","bonjour"],["arrivederci","au revoir"],["scusa","pardon"],["prego","je vous en prie"]]),N("___ amica",["un","uno","una","un'"],3,"F\xE9minin devant voyelle : un'amica.")]},{id:"A2",name:"\xC9l\xE9mentaire",title:"La vie quotidienne",emoji:"\u{1F35D}",color:"#2f7d8c",desc:"Pr\xE9sent, pass\xE9 compos\xE9, l'heure et les pr\xE9positions.",lessons:[{id:"a2-presente",module:"conj",title:"Le pr\xE9sent des verbes",emoji:"\u23F3",intro:"Trois groupes de verbes, une logique commune : une fois le mod\xE8le compris, vous conjuguez des centaines de verbes.",sections:[{title:"Les trois groupes",text:"Verbes en <b>-are</b>, <b>-ere</b> et <b>-ire</b>. On retire la terminaison et on ajoute celle de la personne.",table:{cols:["","parlare","prendere","dormire"],rows:[["io","parlo","prendo","dormo"],["tu","parli","prendi","dormi"],["lui/lei","parla","prende","dorme"],["noi","parliamo","prendiamo","dormiamo"],["voi","parlate","prendete","dormite"],["loro","parlano","prendono","dormono"]]}},{title:"Les verbes en -isc",text:"Certains verbes en -ire ajoutent <b>-isc-</b> sauf \xE0 noi et voi : <i>finire, capire, preferire, pulire</i>.",examples:[["finisco, finisci, finisce","je finis, tu finis, il finit"],["finiamo, finite, finiscono","nous finissons, vous finissez, ils finissent"],["Capisci?","Tu comprends ?"]]},{title:"Les irr\xE9guliers fr\xE9quents",text:"<b>andare</b> : vado, vai, va, andiamo, andate, vanno \xB7 <b>fare</b> : faccio, fai, fa, facciamo, fate, fanno \xB7 <b>volere</b> : voglio \xB7 <b>potere</b> : posso.",examples:[["Vado al lavoro.","Je vais au travail."],["Che cosa fai?","Que fais-tu ?"]]}],mnemo:"La 1re personne finit toujours en -O (parlo, prendo, dormo, finisco) et la 2e en -I. Seule la 3e change selon le groupe.",vocab:[["parlare","parler"],["mangiare","manger"],["prendere","prendre"],["dormire","dormir"],["capire","comprendre"],["andare","aller"],["fare","faire"]],quiz:[ae("Io ___ italiano e francese. (parlare)",["parlo"],"Parlare \u2192 io parlo."),ae("Voi ___ la pizza? (prendere)",["prendete"],"Prendere \u2192 voi prendete."),N("Loro ___ (capire) tutto.",["capono","capiscono","capisciono","capiano"],1,"Capire est un verbe en -isc : capiscono."),N("Comment dit-on \xAB je vais \xBB ?",["ando","vo","vado","andio"],2,"Andare est irr\xE9gulier : vado."),Se("Traduisez : Nous mangeons des p\xE2tes.",["mangiamo la pasta","mangiamo pasta","noi mangiamo la pasta","noi mangiamo pasta","mangiamo della pasta"],"Mangiare \u2192 mangiamo (on ne double pas le i).")]},{id:"a2-passato",module:"conj",title:"Le pass\xE9 compos\xE9 (passato prossimo)",emoji:"\u23F3",intro:"Pour raconter ce que vous avez fait hier, le week-end dernier ou pendant vos vacances.",sections:[{title:"Formation",text:"Auxiliaire <b>avere</b> ou <b>essere</b> au pr\xE9sent + participe pass\xE9 : -are \u2192 <b>-ato</b>, -ere \u2192 <b>-uto</b>, -ire \u2192 <b>-ito</b>.",examples:[["Ho mangiato.","J'ai mang\xE9."],["Hai venduto la macchina?","Tu as vendu la voiture ?"],["Abbiamo dormito bene.","Nous avons bien dormi."]]},{title:"Avere ou essere ?",text:"<b>Essere</b> avec les verbes de mouvement et d'\xE9tat (andare, venire, partire, arrivare, uscire, nascere, restare\u2026), les verbes pronominaux et essere lui-m\xEAme. Le participe s'<b>accorde</b> alors avec le sujet.",examples:[["Maria \xE8 andata a Roma.","Maria est all\xE9e \xE0 Rome."],["Siamo partiti presto.","Nous sommes partis t\xF4t."],["Sono stato in Italia.","J'ai \xE9t\xE9 en Italie."]]},{title:"Participes irr\xE9guliers",text:"fare \u2192 <b>fatto</b> \xB7 dire \u2192 <b>detto</b> \xB7 prendere \u2192 <b>preso</b> \xB7 vedere \u2192 <b>visto</b> \xB7 scrivere \u2192 <b>scritto</b> \xB7 leggere \u2192 <b>letto</b> \xB7 aprire \u2192 <b>aperto</b> \xB7 venire \u2192 <b>venuto</b> \xB7 essere \u2192 <b>stato</b>."}],mnemo:"Les verbes qui prennent \xAB \xEAtre \xBB en fran\xE7ais prennent essere en italien. Bonus : essere se conjugue avec lui-m\xEAme \u2192 sono stato (j'ai \xE9t\xE9).",vocab:[["ieri","hier"],["la settimana scorsa","la semaine derni\xE8re"],["fatto","fait"],["detto","dit"],["visto","vu"],["gi\xE0","d\xE9j\xE0"],["ancora","encore"]],quiz:[N("Ieri Giulia ___ al mare.",["ha andato","\xE8 andato","\xE8 andata","ha andata"],2,"Andare se conjugue avec essere, et le participe s'accorde au f\xE9minin : \xE8 andata."),ae("Ho ___ un bel film. (vedere)",["visto","veduto"],"Visto est le participe usuel de vedere."),N("Participe pass\xE9 de \xAB fare \xBB :",["fato","fatto","faciuto","fasto"],1,"Fare \u2192 fatto (irr\xE9gulier)."),ae("Noi ___ stati a Roma.",["siamo"],"Essere se conjugue avec essere : siamo stati."),Se("Traduisez : J'ai mang\xE9 une pizza.",["ho mangiato una pizza","io ho mangiato una pizza"],"Ho mangiato una pizza.")]},{id:"a2-ore",module:"nombres",title:"L'heure, les jours et les mois",emoji:"\u{1F552}",intro:"Fixer un rendez-vous, lire un horaire, donner une date : les nombres appliqu\xE9s au temps.",sections:[{title:"Che ore sono?",text:"On dit <b>Sono le</b> + heure (pluriel), sauf pour une heure, midi et minuit : <b>\xC8 l'una, \xE8 mezzogiorno, \xE8 mezzanotte</b>. <i>e un quarto</i> = et quart, <i>e mezza</i> = et demie, <i>meno un quarto</i> = moins le quart.",examples:[["Sono le tre.","Il est trois heures."],["\xC8 l'una e mezza.","Il est une heure et demie."],["Sono le otto meno un quarto.","Il est huit heures moins le quart."]]},{title:"Les jours de la semaine",text:"luned\xEC, marted\xEC, mercoled\xEC, gioved\xEC, venerd\xEC, sabato, domenica \u2014 <b>sans majuscule</b>. \xAB Il luned\xEC \xBB = tous les lundis.",examples:[["Ci vediamo sabato.","On se voit samedi."],["Il luned\xEC lavoro.","Le lundi, je travaille."]]},{title:"Les mois et les dates",text:"gennaio, febbraio, marzo, aprile, maggio, giugno, luglio, agosto, settembre, ottobre, novembre, dicembre. Pour les dates, on utilise le nombre cardinal, sauf pour le 1er : <b>il primo maggio</b>, <i>il due giugno</i>."}],mnemo:"Les jours viennent des plan\xE8tes, comme en fran\xE7ais : luned\xEC (Lune), marted\xEC (Mars), mercoled\xEC (Mercure), gioved\xEC (Giove = Jupiter), venerd\xEC (V\xE9nus).",vocab:[["che ore sono?","quelle heure est-il ?"],["mezzogiorno","midi"],["oggi","aujourd'hui"],["domani","demain"],["la settimana","la semaine"],["il mese","le mois"]],quiz:[N("Il est 13 h 00. On dit :",["Sono l'una","\xC8 l'una","\xC8 le tredici","Sono una"],1,"Une heure est au singulier : \xC8 l'una. Pour les autres heures : Sono le\u2026"),N("Comment dit-on \xAB 8 h 30 \xBB ?",["Sono le otto e mezza","\xC8 le otto e mezzo","Sono otto e trenta minuti","Le otto meno mezza"],0,"Sono le otto e mezza (ou e mezzo, les deux existent)."),Be("Associez les jours",[["luned\xEC","lundi"],["gioved\xEC","jeudi"],["sabato","samedi"],["domenica","dimanche"]]),ae("Il ___ maggio \xE8 la festa dei lavoratori.",["primo","1\xB0"],"Pour le 1er du mois on utilise l'ordinal : il primo maggio."),Se("Traduisez : demain",["domani"],"Domani = demain ; dopodomani = apr\xE8s-demain.")]},{id:"a2-preposizioni",module:"gram",title:"Les pr\xE9positions articul\xE9es",emoji:"\u{1F9E9}",intro:"Di, a, da, in, su\u2026 et leurs fusions avec l'article (del, al, nella\u2026). Le point cl\xE9 pour parler naturellement.",sections:[{title:"Les pr\xE9positions simples",text:"<b>di</b> (de) \xB7 <b>a</b> (\xE0) \xB7 <b>da</b> (de / chez / depuis) \xB7 <b>in</b> (en, dans) \xB7 <b>con</b> (avec) \xB7 <b>su</b> (sur) \xB7 <b>per</b> (pour) \xB7 <b>tra / fra</b> (entre, dans [temps])."},{title:"Pr\xE9position + article = une seule forme",text:"Di, a, da, in, su fusionnent avec l'article d\xE9fini.",table:{cols:["","il","lo","la","i","gli","le"],rows:[["di","del","dello","della","dei","degli","delle"],["a","al","allo","alla","ai","agli","alle"],["da","dal","dallo","dalla","dai","dagli","dalle"],["in","nel","nello","nella","nei","negli","nelle"],["su","sul","sullo","sulla","sui","sugli","sulle"]]}},{title:"Les usages cl\xE9s",text:"Ville \u2192 <b>a</b> (a Roma). Pays, r\xE9gion \u2192 <b>in</b> (in Italia). Chez quelqu'un, depuis \u2192 <b>da</b>.",examples:[["Vado al cinema.","Je vais au cin\xE9ma."],["Vado dal medico.","Je vais chez le m\xE9decin."],["Abito qui da tre anni.","J'habite ici depuis trois ans."]]}],mnemo:"\xAB DA \xBB = chez / depuis / provenance : vado dal dentista, abito qui da due anni, vengo da Parigi.",vocab:[["dal medico","chez le m\xE9decin"],["al mare","\xE0 la mer"],["in montagna","\xE0 la montagne"],["sul tavolo","sur la table"],["nella borsa","dans le sac"]],quiz:[N("Vado ___ Roma.",["in","a","da","per"],1,"Villes \u2192 a. Pays et r\xE9gions \u2192 in."),N("Il libro \xE8 ___ tavolo.",["su il","sul","sullo","sui"],1,"Su + il = sul."),ae("Stasera vado ___ cinema.",["al"],"A + il = al."),N("Studio italiano ___ due anni. (depuis)",["per","da","di","fra"],1,"Da exprime une dur\xE9e qui dure encore : depuis."),ae("Le chiavi sono ___ borsa. (dans le)",["nella"],"In + la = nella.")]}],exam:[ae("Lei ___ (finire) il lavoro alle sei.",["finisce"],"Finire (-isc) : lei finisce."),N("Siamo ___ in Italia l'estate scorsa.",["andato","andati","andate","andare"],1,"Essere + accord au pluriel (masculin ou mixte) : andati."),N("Comment dit-on 15 h 45 ?",["Sono le quattro meno un quarto","\xC8 le tre e tre quarti","Sono le cinque meno un quarto","\xC8 le quattro meno quarto"],0,"Sono le quattro meno un quarto (ou sono le quindici e quarantacinque)."),ae("Vado ___ dentista. (chez le)",["dal"],"Da + il = dal."),ae("Ieri ho ___ una lettera. (scrivere)",["scritto"],"Scrivere \u2192 scritto."),N("\xAB Je fais \xBB se dit :",["faco","faccio","fao","facio"],1,"Fare \u2192 io faccio."),Be("Associez les mois",[["gennaio","janvier"],["giugno","juin"],["luglio","juillet"],["dicembre","d\xE9cembre"]]),Se("Traduisez : Je pars demain.",["parto domani","domani parto","io parto domani"],"Parto domani : le pr\xE9sent sert souvent de futur proche.")]},{id:"B1",name:"Seuil",title:"Raconter et se projeter",emoji:"\u{1F6F5}",color:"#c98a1b",desc:"Imparfait, futur, conditionnel, pronoms et premi\xE8res expressions.",lessons:[{id:"b1-imperfetto",module:"conj",title:"L'imparfait et son usage",emoji:"\u23F3",intro:"D\xE9crire le pass\xE9, raconter des habitudes, planter le d\xE9cor d'une histoire.",sections:[{title:"Une formation tr\xE8s r\xE9guli\xE8re",text:"On retire <b>-re</b> de l'infinitif et on ajoute <b>-vo, -vi, -va, -vamo, -vate, -vano</b>. Seul essere est vraiment irr\xE9gulier : <b>ero, eri, era, eravamo, eravate, erano</b>. Fare \u2192 <i>facevo</i>, dire \u2192 <i>dicevo</i>, bere \u2192 <i>bevevo</i>.",examples:[["parlavo","je parlais"],["prendevamo","nous prenions"],["dormivano","ils dormaient"]]},{title:"Imperfetto ou passato prossimo ?",text:"<b>Imperfetto</b> : description, habitude, action en cours. <b>Passato prossimo</b> : action ponctuelle et termin\xE9e.",examples:[["Mentre leggevo, \xE8 squillato il telefono.","Pendant que je lisais, le t\xE9l\xE9phone a sonn\xE9."],["Da bambino giocavo a calcio.","Enfant, je jouais au foot."]]},{title:"Les mots-indices",text:"<i>da bambino, di solito, sempre, ogni giorno, mentre</i> \u2192 imperfetto. <i>ieri, all'improvviso, una volta, a un certo punto</i> \u2192 passato prossimo."}],mnemo:"L'imperfetto est le d\xE9cor du film (il pleuvait, j'\xE9tais fatigu\xE9) ; le passato prossimo est l'action (soudain, le t\xE9l\xE9phone a sonn\xE9).",vocab:[["da bambino","enfant (quand j'\xE9tais petit)"],["di solito","d'habitude"],["mentre","pendant que"],["all'improvviso","soudain"],["squillare","sonner (t\xE9l\xE9phone)"]],quiz:[ae("Da bambino ___ sempre al parco. (andare, io)",["andavo"],"Habitude pass\xE9e \u2192 imperfetto : andavo."),N("Mentre ___, \xE8 arrivato Luca.",["ho cucinato","cucinavo","cucino","cuciner\xF2"],1,"Action en cours (le d\xE9cor) \u2192 imperfetto."),ae("Quando ero piccola, ___ molto timida. (essere, io)",["ero"],"Description dans le pass\xE9 : ero."),N("Choisissez la phrase correcte :",["All'improvviso cominciava a piovere.","All'improvviso ha cominciato a piovere.","All'improvviso comincia a piovuto.","All'improvviso era cominciato piovere."],1,"Action soudaine et ponctuelle \u2192 passato prossimo."),Se("Traduisez : Il faisait beau.",["faceva bel tempo","era bel tempo","c'era bel tempo"],"Description m\xE9t\xE9o au pass\xE9 : faceva bel tempo.")]},{id:"b1-futuro",module:"conj",title:"Le futur et le conditionnel",emoji:"\u{1F52E}",intro:"Parler de vos projets, faire des suppositions et formuler des demandes polies.",sections:[{title:"Le futur simple",text:"-are et -ere \u2192 <b>-er\xF2</b>, -ire \u2192 <b>-ir\xF2</b> : parler\xF2, parlerai, parler\xE0, parleremo, parlerete, parleranno. Irr\xE9guliers : essere \u2192 <b>sar\xF2</b>, avere \u2192 <b>avr\xF2</b>, andare \u2192 <b>andr\xF2</b>, fare \u2192 <b>far\xF2</b>, venire \u2192 <b>verr\xF2</b>, potere \u2192 <b>potr\xF2</b>.",examples:[["L'anno prossimo andr\xF2 in Italia.","L'an prochain j'irai en Italie."]]},{title:"Le futur de probabilit\xE9",text:"L'italien utilise le futur pour une <b>supposition</b> au pr\xE9sent.",examples:[["Che ore saranno?","Quelle heure peut-il bien \xEAtre ?"],["Sar\xE0 a casa.","Il doit \xEAtre \xE0 la maison."]]},{title:"Le conditionnel pr\xE9sent",text:"M\xEAme radical que le futur + <b>-ei, -esti, -ebbe, -emmo, -este, -ebbero</b>.",examples:[["Vorrei un caff\xE8.","Je voudrais un caf\xE9."],["Potresti aiutarmi?","Pourrais-tu m'aider ?"],["Mi piacerebbe viaggiare.","J'aimerais voyager."]]}],mnemo:"Futur et conditionnel partagent le m\xEAme radical. Conna\xEEtre sar\xF2, c'est conna\xEEtre sarei ; avr\xF2 \u2192 avrei ; verr\xF2 \u2192 verrei.",vocab:[["l'anno prossimo","l'an prochain"],["fra una settimana","dans une semaine"],["vorrei","je voudrais"],["mi piacerebbe","j'aimerais"],["magari","peut-\xEAtre / si seulement"]],quiz:[ae("L'anno prossimo ___ in Italia. (andare, io)",["andr\xF2"],"Andare au futur : andr\xF2."),N("\xAB Vorrei un cappuccino \xBB signifie :",["Je veux un cappuccino","Je voudrais un cappuccino","J'ai voulu un cappuccino","Je voulais un cappuccino"],1,"Vorrei = conditionnel de volere."),N("Futur de \xAB essere \xBB (loro) :",["esseranno","saranno","sarebbero","sono"],1,"Saranno. Sarebbero est le conditionnel."),ae("___ aiutarmi, per favore? (potere, tu, conditionnel)",["potresti"],"Potere \u2192 potr- + esti = potresti."),N("\xAB Dov'\xE8 Marco? \u2014 Sar\xE0 a casa. \xBB Ici, \xAB sar\xE0 \xBB exprime :",["un fait futur","une supposition","un pass\xE9","une condition"],1,"Futur de probabilit\xE9 : il doit \xEAtre \xE0 la maison.")]},{id:"b1-pronomi",module:"gram",title:"Les pronoms compl\xE9ments, ne et ci",emoji:"\u{1F9E9}",intro:"\xC9viter les r\xE9p\xE9titions comme un natif : lo, la, gli, le, ne, ci.",sections:[{title:"Les pronoms COD",text:"<b>mi, ti, lo, la, ci, vi, li, le</b>. Avant le verbe conjugu\xE9, ou attach\xE9s \xE0 l'infinitif.",examples:[["Lo vedo stasera.","Je le vois ce soir."],["Voglio vederla. / La voglio vedere.","Je veux la voir."]]},{title:"Les pronoms COI",text:"<b>mi, ti, gli</b> (\xE0 lui), <b>le</b> (\xE0 elle), <b>Le</b> (\xE0 vous), <b>ci, vi, gli</b> (\xE0 eux).",examples:[["Gli scrivo una mail.","Je lui \xE9cris un mail (\xE0 lui)."],["Le telefono domani.","Je lui t\xE9l\xE9phone demain (\xE0 elle)."],["Mi piace la pizza.","J'aime la pizza (elle me pla\xEEt)."]]},{title:"Ne et ci",text:"<b>ne</b> = en (quantit\xE9, \xAB de cela \xBB) \xB7 <b>ci</b> = y (lieu).",examples:[["Quanti caff\xE8 bevi? \u2014 Ne bevo tre.","Combien de caf\xE9s bois-tu ? \u2014 J'en bois trois."],["Vai a Roma? \u2014 S\xEC, ci vado domani.","Tu vas \xE0 Rome ? \u2014 Oui, j'y vais demain."]]}],mnemo:"Piacere = \xAB plaire \xBB : mi piace la pizza (la pizza me pla\xEEt), mi piacciono gli spaghetti (pluriel, car c'est le sujet !).",vocab:[["piacere","plaire"],["telefonare a","t\xE9l\xE9phoner \xE0"],["ne","en"],["ci","y"]],quiz:[N("Vedi Marco stasera? \u2014 S\xEC, ___ vedo alle otto.",["gli","lo","la","ne"],1,"COD masculin : lo."),N("Hai telefonato a Giulia? \u2014 S\xEC, ___ ho telefonato.",["la","gli","le","lo"],2,"Telefonare a qualcuno \u2192 COI ; au f\xE9minin : le."),ae("Quante mele vuoi? \u2014 ___ voglio due.",["ne"],"Ne remplace une quantit\xE9 : j'en veux deux."),N("___ piacciono i film italiani.",["Mi","Io","Me","Mio"],0,"Mi piacciono : les films me plaisent."),ae("Vai spesso al mare? \u2014 S\xEC, ___ vado ogni estate.",["ci"],"Ci remplace le lieu : j'y vais.")]},{id:"b1-espressioni",module:"expr",title:"Expressions idiomatiques du quotidien",emoji:"\u{1F4AC}",intro:"Ce qui fait passer d'un italien scolaire \xE0 un italien vivant.",sections:[{title:"Souhaiter bonne chance",text:"On dit <b>In bocca al lupo!</b> (\xAB dans la gueule du loup \xBB) et on r\xE9pond <b>Crepi!</b> (\xAB qu'il cr\xE8ve ! \xBB). Ne r\xE9pondez jamais <i>grazie</i>, cela porterait malheur."},{title:"Les classiques",examples:[["Non vedo l'ora!","J'ai h\xE2te !"],["Costa un occhio della testa.","\xC7a co\xFBte les yeux de la t\xEAte."],["Sono al verde.","Je suis fauch\xE9."],["Che figura!","La honte !"],["Facciamo due passi?","On fait un tour ?"]]},{title:"Les petits mots magiques",examples:[["Boh!","Je ne sais pas."],["Magari!","Si seulement !"],["Dai!","Allez !"],["Meno male!","Heureusement !"],["Figurati!","De rien / penses-tu !"]]}],mnemo:"\xAB Fare bella figura \xBB est une valeur culturelle centrale : soigner son image en public. Une \xAB brutta figura \xBB est une petite honte sociale.",vocab:[["in bocca al lupo","bonne chance"],["crepi","r\xE9ponse \xE0 \xAB in bocca al lupo \xBB"],["non vedo l'ora","j'ai h\xE2te"],["essere al verde","\xEAtre fauch\xE9"],["boh","je ne sais pas"],["magari","si seulement"],["figurati","de rien / penses-tu"],["meno male","heureusement"]],quiz:[N("Un ami vous dit \xAB In bocca al lupo! \xBB avant votre examen. Vous r\xE9pondez :",["Grazie mille!","Crepi!","Anche a te!","Prego!"],1,"La r\xE9ponse traditionnelle est Crepi! (et jamais grazie)."),Be("Associez",[["non vedo l'ora","j'ai h\xE2te"],["essere al verde","\xEAtre fauch\xE9"],["meno male","heureusement"],["figurati","de rien / penses-tu"]]),N("\xAB Questo telefono costa un occhio della testa \xBB signifie :",["Il est tr\xE8s cher","Il est cass\xE9","Il est bon march\xE9","Il est tr\xE8s beau"],0,"M\xEAme image qu'en fran\xE7ais : les yeux de la t\xEAte."),N("\xAB Vieni alla festa? \u2014 Boh... \xBB La personne :",["accepte avec joie","ne sait pas","refuse","est en col\xE8re"],1,"Boh exprime l'incertitude."),Se("Traduisez : J'ai h\xE2te !",["non vedo l'ora"],"Litt\xE9ralement : \xAB je ne vois pas l'heure \xBB.")]}],exam:[ae("Quando avevo dieci anni, ___ (giocare, io) a calcio.",["giocavo"],"Habitude pass\xE9e : giocavo."),N("Domani ___ (fare, noi) una gita.",["faremo","fareremo","farremo","facessimo"],0,"Fare au futur : faremo."),N("Hai visto le ragazze? \u2014 S\xEC, ___ ho viste.",["li","le","gli","ne"],1,"COD f\xE9minin pluriel : le (et le participe s'accorde : viste)."),N("In bocca al lupo! \u2014 \u2026",["Crepi!","Grazie!","Prego!","Salute!"],0,"Crepi!"),ae("___ un caff\xE8, per favore. (volere, conditionnel, io)",["vorrei"],"Vorrei."),N("Mentre ___ la TV, \xE8 andata via la luce.",["ho guardato","guardavo","guarder\xF2","guardassi"],1,"Action en cours \u2192 imperfetto."),ae("Quanti fratelli hai? \u2014 ___ ho due.",["ne"],"Ne ho due : j'en ai deux."),Se("Traduisez : Je suis fauch\xE9.",["sono al verde"],"Essere al verde.")]},{id:"B2",name:"Avanc\xE9",title:"Nuancer et argumenter",emoji:"\u{1F3DB}\uFE0F",color:"#b8483f",desc:"Subjonctif, hypoth\xE8ses et italien professionnel.",lessons:[{id:"b2-congiuntivo",module:"conj",title:"Le subjonctif pr\xE9sent (congiuntivo)",emoji:"\u23F3",intro:"Le grand marqueur du niveau B2 : exprimer opinion, d\xE9sir, doute et \xE9motion.",sections:[{title:"Quand l'utiliser ?",text:"Apr\xE8s les verbes d'<b>opinion</b> (penso che, credo che), de <b>volont\xE9</b> (voglio che), de <b>sentiment</b> (sono contento che), de <b>doute</b> (dubito che) et certaines conjonctions (bench\xE9, affinch\xE9, prima che). Grande diff\xE9rence avec le fran\xE7ais : \xAB je pense que c'est vrai \xBB \u2192 <i>penso che <b>sia</b> vero</i>."},{title:"Formation",text:"-are \u2192 terminaisons en <b>-i</b> ; -ere/-ire \u2192 en <b>-a</b>. Les trois personnes du singulier sont identiques : gardez le pronom si c'est ambigu.",table:{cols:["","parlare","prendere","finire"],rows:[["che io/tu/lui","parli","prenda","finisca"],["che noi","parliamo","prendiamo","finiamo"],["che voi","parliate","prendiate","finiate"],["che loro","parlino","prendano","finiscano"]]}},{title:"Les irr\xE9guliers \xE0 conna\xEEtre",text:"essere \u2192 <b>sia</b> \xB7 avere \u2192 <b>abbia</b> \xB7 andare \u2192 <b>vada</b> \xB7 fare \u2192 <b>faccia</b> \xB7 venire \u2192 <b>venga</b> \xB7 potere \u2192 <b>possa</b> \xB7 volere \u2192 <b>voglia</b> \xB7 sapere \u2192 <b>sappia</b> \xB7 dare \u2192 <b>dia</b> \xB7 stare \u2192 <b>stia</b>."}],mnemo:"Ce qui se passe dans votre t\xEAte (opinion, d\xE9sir, peur, doute) \u2192 congiuntivo. Ce qui est un fait certain \u2192 indicatif : so che \xE8 vero (je sais = certitude).",vocab:[["penso che","je pense que"],["credo che","je crois que"],["\xE8 importante ,fr:"Marco prend son t\xE9l\xE9phone et montre une photo."},{who:"Marco",t:"Guarda, questa \xE8 la mia famiglia.",fr:"Regarde, voici ma famille."},{who:"L\xE9a",t:"Chi \xE8 questo signore?",fr:"Qui est ce monsieur ?"},{who:"Marco",t:"\xC8 mio padre. Si chiama Paolo.",fr:"C'est mon p\xE8re. Il s'appelle Paolo."},{who:"L\xE9a",t:"E questa ragazza?",fr:"Et cette fille ?"},{who:"Marco",t:"\xC8 mia sorella Giulia. Ha sedici anni.",fr:"C'est ma s\u0153ur Giulia. Elle a seize ans."},{q:"Qui est Giulia ?",options:["La s\u0153ur de Marco","La m\xE8re de Marco","La cousine de Marco"],answer:0},{who:"L\xE9a",t:"E lei \xE8 tua madre?",fr:"Et elle, c'est ta m\xE8re ?"},{who:"Marco",t:"No, \xE8 mia nonna! Ha ottant'anni, ma \xE8 sempre contenta.",fr:"Non, c'est ma grand-m\xE8re ! Elle a quatre-vingts ans, mais elle est toujours contente."},{q:"Quel \xE2ge a la grand-m\xE8re ?",options:["80 ans","60 ans","16 ans"],answer:0},{who:"Marco",t:"E tu, hai fratelli?",fr:"Et toi, tu as des fr\xE8res et s\u0153urs ?"},{who:"L\xE9a",t:"S\xEC, ho un fratello. Si chiama Hugo e abita a Parigi.",fr:"Oui, j'ai un fr\xE8re. Il s'appelle Hugo et il habite \xE0 Paris."},{q:"O\xF9 habite le fr\xE8re de L\xE9a ?",options:["\xC0 Paris","\xC0 Rome","\xC0 Lyon"],answer:0}]},{id:"it-ristorante",after:"a1-cibo",emoji:"\u{1F35D}",title:"Al ristorante",intro:"Le soir, L\xE9a et Marco d\xEEnent dans une petite trattoria.",lines:[{who:"",t:"\xC8 sera. L\xE9a e Marco sono in un piccolo ristorante.",fr:"C'est le soir. L\xE9a et Marco sont dans un petit restaurant."},{who:"Cameriere",t:"Buonasera! Cosa prendete?",fr:"Bonsoir ! Qu'est-ce que vous prenez ?"},{who:"L\xE9a",t:"Vorrei la pasta al pomodoro, per favore.",fr:"Je voudrais les p\xE2tes \xE0 la tomate, s'il vous pla\xEEt."},{who:"Marco",t:"Per me il pesce con la verdura.",fr:"Pour moi, le poisson avec des l\xE9gumes."},{q:"Que commande L\xE9a ?",options:["Des p\xE2tes \xE0 la tomate","Du poisson","De la viande"],answer:0},{who:"Cameriere",t:"E da bere?",fr:"Et \xE0 boire ?"},{who:"Marco",t:"Un bicchiere di vino rosso.",fr:"Un verre de vin rouge."},{who:"L\xE9a",t:"Io prendo l'acqua. Non bevo vino.",fr:"Moi, je prends de l'eau. Je ne bois pas de vin."},{q:"Que boit L\xE9a ?",options:["De l'eau","Du vin rouge","De la bi\xE8re"],answer:0},{who:"L\xE9a",t:"Mmm, la pasta \xE8 molto buona!",fr:"Mmm, les p\xE2tes sont tr\xE8s bonnes !"},{who:"Marco",t:"Scusi, il conto per favore!",fr:"Excusez-moi, l'addition s'il vous pla\xEEt !"},{who:"Cameriere",t:"Sono trentadue euro.",fr:"\xC7a fait trente-deux euros."},{q:"Combien co\xFBte le repas ?",options:["32 \u20AC","22 \u20AC","42 \u20AC"],answer:0}]},{id:"it-stazione",after:"a1-domande",emoji:"\u{1F689}",title:"Dov'\xE8 la stazione?",intro:"Samedi matin, L\xE9a veut prendre le train pour Florence.",lines:[{who:"",t:"Sabato mattina L\xE9a vuole andare a Firenze in treno.",fr:"Samedi matin, L\xE9a veut aller \xE0 Florence en train."},{who:"L\xE9a",t:"Scusi, signora, dov'\xE8 la stazione?",fr:"Excusez-moi, madame, o\xF9 est la gare ?"},{who:"Signora",t:"Non \xE8 lontano. Vada dritto, poi giri a destra.",fr:"Ce n'est pas loin. Allez tout droit, puis tournez \xE0 droite."},{q:"Que doit faire L\xE9a d'abord ?",options:["Aller tout droit","Tourner \xE0 gauche","Prendre le bus"],answer:0},{who:"L\xE9a",t:"Quanti minuti a piedi?",fr:"Combien de minutes \xE0 pied ?"},{who:"Signora",t:"Dieci minuti, pi\xF9 o meno.",fr:"Dix minutes, \xE0 peu pr\xE8s."},{who:"L\xE9a",t:"E c'\xE8 una farmacia vicino?",fr:"Et il y a une pharmacie pr\xE8s d'ici ?"},{who:"Signora",t:"S\xEC, c'\xE8 una farmacia in piazza, a sinistra della stazione.",fr:"Oui, il y a une pharmacie sur la place, \xE0 gauche de la gare."},{q:"O\xF9 est la pharmacie ?",options:["Sur la place, \xE0 gauche de la gare","\xC0 droite de l'h\xF4tel","Loin de la gare"],answer:0},{who:"L\xE9a",t:"Grazie mille!",fr:"Merci beaucoup !"},{who:"Signora",t:"Prego! Buon viaggio!",fr:"Je vous en prie ! Bon voyage !"},{q:"O\xF9 va L\xE9a ?",options:["\xC0 Florence","\xC0 Naples","\xC0 Lyon"],answer:0}]},{id:"it-weekend",after:"a2-passato-essere",emoji:"\u{1F30A}",title:"Un fine settimana al mare",level:"A2",intro:"Lundi matin, \xE0 l'\xE9cole de langues, Marco demande \xE0 L\xE9a ce qu'elle a fait ce week-end.",lines:[{who:"Marco",t:"Ciao L\xE9a! Com'\xE8 andato il fine settimana?",fr:"Salut L\xE9a ! Comment s'est pass\xE9 ton week-end ?"},{who:"L\xE9a",t:"Benissimo! Sabato mattina sono partita per Napoli con due amiche.",fr:"Tr\xE8s bien ! Samedi matin, je suis partie \xE0 Naples avec deux amies."},{who:"Marco",t:"A Napoli? La mia citt\xE0! Cosa avete fatto?",fr:"\xC0 Naples ? Ma ville ! Qu'est-ce que vous avez fait ?"},{who:"L\xE9a",t:"Abbiamo visitato il centro e abbiamo mangiato una pizza buonissima.",fr:"Nous avons visit\xE9 le centre et nous avons mang\xE9 une pizza d\xE9licieuse."},{q:"Avec qui L\xE9a est-elle partie ?",options:["Avec deux amies","Avec Marco","Avec sa famille"],answer:0},{who:"L\xE9a",t:"Domenica siamo andate al mare, ma ha piovuto tutto il pomeriggio!",fr:"Dimanche, nous sommes all\xE9es \xE0 la mer, mais il a plu tout l'apr\xE8s-midi !"},{who:"Marco",t:"Che peccato! E siete tornate a Roma in treno?",fr:"Dommage ! Et vous \xEAtes rentr\xE9es \xE0 Rome en train ?"},{who:"L\xE9a",t:"S\xEC, ma il treno \xE8 partito con un'ora di ritardo. Sono arrivata a casa a mezzanotte.",fr:"Oui, mais le train est parti avec une heure de retard. Je suis arriv\xE9e chez moi \xE0 minuit."},{q:"Quel temps a-t-il fait dimanche ?",options:["Il a plu","Il a fait tr\xE8s chaud","Il a neig\xE9"],answer:0},{who:"Marco",t:"Allora oggi sei stanca!",fr:"Alors aujourd'hui, tu es fatigu\xE9e !"},{who:"L\xE9a",t:"Un po'. Mi sono svegliata tardi e non ho ancora fatto colazione.",fr:"Un peu. Je me suis r\xE9veill\xE9e tard et je n'ai pas encore pris de petit-d\xE9jeuner."},{who:"Marco",t:"Andiamo al bar, ti offro un cornetto!",fr:"Allons au bar, je t'offre un croissant !"},{q:"\xC0 quelle heure L\xE9a est-elle rentr\xE9e ?",options:["\xC0 minuit","\xC0 midi","\xC0 huit heures"],answer:0},{q:"Pourquoi L\xE9a n'a-t-elle pas mang\xE9 ce matin ?",options:["Elle s'est r\xE9veill\xE9e tard","Elle n'avait pas faim","Le bar \xE9tait ferm\xE9"],answer:0}]},{id:"it-casa",after:"a2-casa",emoji:"\u{1F511}",title:"Cerco casa",level:"A2",intro:"L\xE9a veut quitter sa chambre d'\xE9tudiante. Elle appelle pour une annonce : \xAB Affittasi bilocale arredato \xBB.",lines:[{who:"Signor Rossi",t:"Pronto?",fr:"All\xF4 ?"},{who:"L\xE9a",t:"Buongiorno, chiamo per l'annuncio del bilocale. \xC8 ancora libero?",fr:"Bonjour, j'appelle pour l'annonce du deux-pi\xE8ces. Il est encore libre ?"},{who:"Signor Rossi",t:"S\xEC, \xE8 libero dal primo dicembre.",fr:"Oui, il est libre \xE0 partir du premier d\xE9cembre."},{who:"L\xE9a",t:"Quanto costa l'affitto?",fr:"Combien co\xFBte le loyer ?"},{who:"Signor Rossi",t:"Seicento euro al mese, spese incluse.",fr:"Six cents euros par mois, charges comprises."},{q:"Combien co\xFBte le loyer ?",options:["600 \u20AC charges comprises","600 \u20AC sans les charges","500 \u20AC par mois"],answer:0},{who:"L\xE9a",t:"A che piano \xE8? C'\xE8 l'ascensore?",fr:"C'est \xE0 quel \xE9tage ? Il y a un ascenseur ?"},{who:"Signor Rossi",t:"\xC8 al quarto piano, ma purtroppo non c'\xE8 l'ascensore.",fr:"C'est au quatri\xE8me \xE9tage, mais malheureusement il n'y a pas d'ascenseur."},{who:"L\xE9a",t:"Non importa, cos\xEC faccio sport! \xC8 luminoso?",fr:"Pas grave, comme \xE7a je fais du sport ! Il est lumineux ?"},{who:"Signor Rossi",t:"Molto. Il soggiorno ha due finestre e la cucina d\xE0 sul giardino.",fr:"Tr\xE8s. Le s\xE9jour a deux fen\xEAtres et la cuisine donne sur le jardin."},{q:"Qu'est-ce qui manque dans l'immeuble ?",options:["L'ascenseur","Le jardin","Les fen\xEAtres"],answer:0},{who:"L\xE9a",t:"Perfetto. Potrei vederlo domani pomeriggio?",fr:"Parfait. Pourrais-je le voir demain apr\xE8s-midi ?"},{who:"Signor Rossi",t:"Certo. Alle cinque va bene?",fr:"Bien s\xFBr. \xC0 cinq heures, \xE7a vous va ?"},{who:"L\xE9a",t:"Va benissimo. Grazie, a domani!",fr:"Tr\xE8s bien. Merci, \xE0 demain !"},{q:"Quand L\xE9a va-t-elle visiter l'appartement ?",options:["Demain \xE0 17 h","Aujourd'hui \xE0 17 h","Le 1er d\xE9cembre"],answer:0}]},{id:"it-medico",after:"a2-salute",emoji:"\u{1F912}",title:"Dal medico",level:"A2",intro:"Depuis deux jours, L\xE9a ne se sent pas bien. Elle va chez le m\xE9decin.",lines:[{who:"Dottoressa",t:"Buongiorno, si accomodi. Cosa si sente?",fr:"Bonjour, asseyez-vous. Qu'est-ce que vous ressentez ?"},{who:"L\xE9a",t:"Da due giorni ho mal di gola e mi fa male la testa.",fr:"Depuis deux jours, j'ai mal \xE0 la gorge et j'ai mal \xE0 la t\xEAte."},{who:"Dottoressa",t:"Ha anche la febbre?",fr:"Vous avez aussi de la fi\xE8vre ?"},{who:"L\xE9a",t:"S\xEC, ieri sera avevo trentotto e mezzo.",fr:"Oui, hier soir j'avais trente-huit et demi."},{q:"Depuis quand L\xE9a est-elle malade ?",options:["Depuis deux jours","Depuis une semaine","Depuis ce matin"],answer:0},{who:"Dottoressa",t:"Vediamo\u2026 Apra la bocca, per favore. S\xEC, la gola \xE8 molto rossa.",fr:"Voyons\u2026 Ouvrez la bouche, s'il vous pla\xEEt. Oui, la gorge est tr\xE8s rouge."},{who:"Dottoressa",t:"Non \xE8 niente di grave: \xE8 un'influenza.",fr:"Ce n'est rien de grave : c'est une grippe."},{who:"Dottoressa",t:"Prenda queste compresse tre volte al giorno, dopo i pasti.",fr:"Prenez ces comprim\xE9s trois fois par jour, apr\xE8s les repas."},{q:"Comment L\xE9a doit-elle prendre les comprim\xE9s ?",options:["Trois fois par jour, apr\xE8s les repas","Une fois le soir","Avant chaque repas"],answer:0},{who:"L\xE9a",t:"Posso andare a lezione domani?",fr:"Je peux aller en cours demain ?"},{who:"Dottoressa",t:"No, deve riposarsi almeno tre giorni. Beva molta acqua e stia a letto.",fr:"Non, vous devez vous reposer au moins trois jours. Buvez beaucoup d'eau et restez au lit."},{who:"L\xE9a",t:"Va bene. Grazie, dottoressa!",fr:"D'accord. Merci, docteur !"},{q:"Qu'est-ce que L\x
