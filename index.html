.mode-pick button small { color: var(--muted); font-size: .74rem; line-height: 1.25; }
.mode-pick button.on { border-color: var(--verde); background: var(--verde-l); }
.pts-line { margin: 2px 0 0; font-weight: 800; color: var(--blu); }

/* Fenêtres : le contenu défile DANS la fenêtre, jamais la page derrière */
.modal-backdrop { overscroll-behavior: contain; touch-action: none; }
.modal { display: flex; flex-direction: column; max-height: calc(100vh - 40px); max-height: calc(100dvh - 40px); touch-action: auto; }
.modal > h2 { flex: none; }
.modal-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; margin: 0 -6px; padding: 0 6px; }
.modal-actions { flex: none; }
html.modal-open, html.modal-open body { overflow: hidden; }
@media (max-width: 480px) { .modal { padding: 20px 18px; } }

/* =====================================================================
   19. FIL D'ACTIVITÉ ET DUEL EN DIRECT
   ===================================================================== */
.fr-tabs { overflow-x: auto; scrollbar-width: none; }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.feed-item { display: flex; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.feed-item:last-child { border-bottom: 0; }
.feed-av { position: relative; flex: none; text-decoration: none; }
.feed-ico { position: absolute; right: -6px; bottom: -4px; font-size: 1.05rem; background: var(--card); border-radius: 50%; width: 26px; height: 26px; display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0, 0, 0, .15); }
.feed-body { min-width: 0; flex: 1; }
.feed-body p { margin: 0; line-height: 1.35; }
.rx-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.rx { border: 1.5px solid var(--line); background: var(--paper); border-radius: 99px; padding: 3px 10px; font-size: 1rem; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; transition: transform .1s; }
.rx i { font-style: normal; font-size: .78rem; font-weight: 800; color: var(--ink-2); }
.rx.on { border-color: var(--blu); background: #e6eef7; }
.rx:not(:disabled):active { transform: scale(1.15); }
.rx:disabled { cursor: default; opacity: 1; }
.feed-by { font-size: .78rem; color: var(--muted); margin: 6px 0 0 !important; }
html.dark .rx { background: var(--paper-2); } html.dark .rx.on { background: #1c3550; }

.live-opt { display: flex; gap: 10px; align-items: flex-start; margin: 14px 0 4px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; cursor: pointer; }
.live-opt input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--verde); flex: none; }
.live-txt { display: flex; flex-direction: column; gap: 2px; }
.live-txt small { color: var(--muted); font-size: .78rem; }
.live-opt:has(input:checked) { border-color: var(--verde); background: var(--verde-l); }

.seat { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.seat-st { font-size: .75rem; font-weight: 800; padding: 2px 10px; border-radius: 99px; background: var(--paper-2); color: var(--muted); }
.seat-st.on { color: var(--blu); }
.seat-st.ok { background: var(--verde-l); color: var(--verde); }
.live-lobby [data-ready] { margin-top: 6px; }
.live-bars { display: grid; gap: 6px; margin-top: 8px; width: 100%; flex-basis: 100%; }
.lb { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; align-items: center; gap: 8px; font-size: .8rem; }
.lb-who { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-bar { height: 10px; background: var(--paper-2); border-radius: 99px; overflow: hidden; }
.lb-bar span { display: block; height: 100%; border-radius: 99px; transition: width .4s; background: var(--verde); }
.lb.op .lb-bar span { background: var(--blu); }
.lb-sc { font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.duel-hud { flex-wrap: wrap; }
.live-watch { margin: 12px 0; padding: 12px; border-radius: 12px; background: var(--paper); text-align: left; }
html.dark .live-watch { background: var(--paper-2); }
.live-h { margin: 0 0 4px; font-weight: 800; }
.fr-tabs { display: flex !important; flex-wrap: nowrap !important; gap: 4px; }
.fr-tabs button { flex: 1 0 auto; white-space: nowrap; padding: 8px 8px; font-size: .84rem; }
.muted-chip { background: var(--paper-2) !important; color: var(--muted) !important; }
.story-done small { display: block; font-size: .68rem; color: var(--muted); font-weight: 700; }

/* =====================================================================
   20. AVATARS : emoji parfaitement centré
   La police du texte décale l'emoji vers le bas : on force la police
   emoji et une hauteur de ligne de 1 dans toutes les pastilles.
   ===================================================================== */
.s-avatar, .hdr-avatar, .acc-avatar, .avatar-opt, .pf-avatar, .pick-friend .s-avatar {
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Twemoji Mozilla", sans-serif;
  line-height: 1; display: grid; place-items: center; text-align: center; overflow: hidden;
  font-style: normal; font-weight: 400; padding: 0;
}
.s-avatar { font-size: 26px; }
.s-avatar.sm { font-size: 21px; }
.s-avatar.lg { font-size: 36px; }
.s-avatar.xl { font-size: 46px; }
.pf-friends .s-avatar { font-size: 32px; }
.pod .s-avatar.lg { font-size: 38px; }
.champ .s-avatar.sm, .hist-win .s-avatar.sm { font-size: 16px; }
.hdr-me .hdr-avatar { font-size: 25px; }
.acc-avatar { font-size: 30px; }
/* Grand avatar du profil : un médaillon rond, centré sur le bandeau */
.pf-avatar { top: auto; bottom: 34px; left: 50%; transform: translateX(-50%); width: 168px; height: 168px; border-radius: 50%;
  font-size: 104px; background: rgba(255, 255, 255, .32); box-shadow: 0 0 0 6px rgba(255, 255, 255, .45), 0 14px 30px -10px rgba(0, 0, 0, .3); filter: none; }
.small-banner .pf-avatar { width: 132px; height: 132px; font-size: 80px; bottom: 30px; }
a.pf-avatar:hover { transform: translateX(-50%) scale(1.04); }
@media (max-width: 560px) { .pf-avatar { width: 150px; height: 150px; font-size: 92px; } }
html.dark .pf-avatar { background: rgba(255, 255, 255, .18); box-shadow: 0 0 0 6px rgba(255, 255, 255, .22), 0 14px 30px -10px rgba(0, 0, 0, .5); }
.fr-tabs button { flex: 1 1 0; min-width: 0; padding: 9px 2px; font-size: .8rem; }
@media (min-width: 520px) { .fr-tabs button { font-size: .92rem; padding: 10px 6px; } }
.fr-tabs button { flex: 1 1 auto; } .fr-tabs { gap: 2px; padding: 4px; }

/* =====================================================================
   21. MESSAGERIE PLEIN ÉCRAN
   ===================================================================== */
body.chat-mode .topbar, body.chat-mode .tabbar { display: none; }
body.chat-mode { overflow: hidden; }
.chat-full { position: fixed; left: 0; right: 0; top: 0; height: 100vh; height: 100dvh; z-index: 30; display: flex; flex-direction: column; background: var(--paper); max-width: 760px; margin: 0 auto; }
.cf-head { flex: none; display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top)) 10px 8px; background: var(--card); border-bottom: 1px solid var(--line); }
.cf-back { font-size: 2.2rem; line-height: 1; padding: 0 8px 4px; color: var(--ink); text-decoration: none; }
.cf-who { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; color: var(--ink); text-decoration: none; }
.cf-who span { display: flex; flex-direction: column; min-width: 0; }
.cf-who b { font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cf-who small { color: var(--muted); font-size: .78rem; display: flex; align-items: center; gap: 4px; }
.cf-defi { width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--paper); font-size: 1.2rem; flex: none; }
.cf-msgs { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 12px 12px 8px; display: flex; flex-direction: column; }
.cf-msgs > :first-child { margin-top: auto; }
.cf-empty { margin: auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.cf-empty p { margin: 0; }
.cf-day { text-align: center; margin: 14px 0 8px; }
.cf-day span { font-size: .72rem; font-weight: 800; color: var(--muted); background: var(--paper-2); padding: 3px 10px; border-radius: 99px; text-transform: capitalize; }
.cf-msg { display: flex; margin-top: 2px; }
.cf-msg.first { margin-top: 8px; }
.cf-msg.me { justify-content: flex-end; }
.cf-msg p { margin: 0; max-width: 78%; padding: 8px 12px 6px; border-radius: 18px; font-size: 1rem; line-height: 1.35; white-space: pre-wrap; overflow-wrap: anywhere; }
.cf-msg.them p { background: var(--card); border: 1px solid var(--line); color: var(--ink); }
.cf-msg.me p { background: var(--verde); color: #fff; }
body.lang-zh .cf-msg.me p { background: var(--rosso); }
.cf-msg.me:not(.last) p { border-bottom-right-radius: 6px; }
.cf-msg.me:not(.first) p { border-top-right-radius: 6px; }
.cf-msg.them:not(.last) p { border-bottom-left-radius: 6px; }
.cf-msg.them:not(.first) p { border-top-left-radius: 6px; }
.cf-msg time { float: right; margin: 6px 0 -2px 10px; font-size: .68rem; opacity: .7; }
.cf-msg:not(.last) time { display: none; }
.cf-msg.big p { background: none !important; border: 0 !important; font-size: 2.6rem; padding: 0 4px; }
.cf-msg.big time { color: var(--muted); font-size: .68rem; }
.cf-msg.pending p { opacity: .6; }
.cf-receipt { margin: 3px 4px 0 auto; font-size: .7rem; color: var(--muted); font-weight: 700; }
.cf-new { position: absolute; left: 50%; transform: translateX(-50%); bottom: 130px; border: 0; border-radius: 99px; padding: 7px 14px; background: var(--ink); color: var(--paper); font-weight: 800; font-size: .82rem; box-shadow: var(--shadow); }
.cf-foot { flex: none; background: var(--card); border-top: 1px solid var(--line); padding: 6px 10px calc(8px + env(safe-area-inset-bottom)); }
.cf-quick { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 8px; }
.cf-quick::-webkit-scrollbar { display: none; }
.cf-quick .chip-btn { flex: none; white-space: nowrap; }
.cf-send { display: flex; align-items: flex-end; gap: 8px; }
.cf-send textarea { flex: 1; min-width: 0; resize: none; border: 1.5px solid var(--line); border-radius: 22px; padding: 10px 14px; font: inherit; font-size: 16px; line-height: 1.3; background: var(--paper); color: var(--ink); max-height: 120px; }
.cf-send textarea:focus { outline: none; border-color: var(--verde); }
.cf-go { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 0; background: var(--verde); color: #fff; font-size: 1.15rem; transition: transform .1s, opacity .15s; }
body.lang-zh .cf-go { background: var(--rosso); }
.cf-go:disabled { opacity: .35; }
.cf-go:not(:disabled):active { transform: scale(.9); }

/* Examen blanc */
.blanc-link { display: inline-block; margin-top: 6px; font-size: .78rem; font-weight: 800; color: var(--blu); text-decoration: none; border: 1.5px solid var(--line); background: var(--card); border-radius: 99px; padding: 3px 10px; }
.blanc-link:hover { border-color: var(--blu); }
.blanc-intro { max-width: 620px; margin: 0 auto; text-align: center; }
.blanc-review { text-align: left; margin: 16px auto; max-width: 520px; }
.blanc-review ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.blanc-review li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 10px; }
.blanc-review li small { color: var(--rosso); font-weight: 800; }

/* Test de mi-palier */
.node.checkpoint { width: 74px; height: 74px; border-radius: 50%; font-size: 1.9rem; }
.node.checkpoint.open { background: #7c3aed; box-shadow: 0 6px 0 #5b21b6; }
.node.checkpoint.done { background: #a78bfa; box-shadow: 0 6px 0 #7c3aed; }
.cp-wrap { --x: 0px; }

/* =====================================================================
   22. PARCOURS : bulle « Commencer » et leçons parfaites (3 étoiles)
   ===================================================================== */
.node-wrap { position: relative; }
.node.perfect { background: linear-gradient(145deg, #5eead4, #3b82f6 55%, #8b5cf6); box-shadow: 0 6px 0 #4338ca; }
.node.perfect:active { box-shadow: 0 2px 0 #4338ca; }
.node.perfect::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid rgba(139, 92, 246, .35); }
.node-crown { position: absolute; top: -14px; right: -6px; font-size: 1.25rem; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .25)); transform: rotate(18deg); }
.node.popped { transform: translateY(2px) scale(.97); }
.node-pop { position: absolute; top: 86px; left: 50%; z-index: 15; width: min(280px, calc(100vw - 48px));
  transform: translateX(calc(-50% - var(--x, 0px))) translateY(-6px) scale(.96); opacity: 0;
  transition: opacity .16s, transform .16s; background: var(--lvl); color: #fff; border-radius: 18px; padding: 14px 14px 12px;
  display: flex; flex-direction: column; gap: 4px; text-align: left; box-shadow: 0 16px 34px -12px rgba(0, 0, 0, .45); }
.node-pop.in { opacity: 1; transform: translateX(calc(-50% - var(--x, 0px))) translateY(0) scale(1); }
.node-pop::before { content: ""; position: absolute; top: -8px; left: calc(50% + var(--x, 0px)); width: 16px; height: 16px; background: inherit; transform: translateX(-50%) rotate(45deg); border-radius: 3px; }
.node-pop.done { background: linear-gradient(145deg, var(--oro), #d9962c); }
.node-pop.perfect { background: linear-gradient(145deg, #3b82f6, #8b5cf6); }
.np-title { font-size: 1.05rem; line-height: 1.25; position: relative; }
.np-title rt { color: rgba(255, 255, 255, .85); }
.np-sub { opacity: .92; font-weight: 600; }
.np-note { opacity: .9; font-size: .78rem; }
.np-cta { margin-top: 8px; display: block; text-align: center; background: #fff; color: var(--ink); font-weight: 800; text-transform: uppercase; letter-spacing: .04em; padding: 12px; border-radius: 12px; text-decoration: none; box-shadow: 0 4px 0 rgba(0, 0, 0, .18); }
.np-cta:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 0, 0, .18); }
.np-alt { display: block; text-align: center; color: #fff; font-weight: 700; font-size: .85rem; padding: 6px; text-decoration: underline; text-underline-offset: 3px; }
.node.exam + .node-pop, .cp-wrap .node-pop { top: 96px; }
html.dark .np-cta { background: #f3f4f6; color: #11151b; }
.node-wrap:has(.node-pop) { z-index: 20; }

/* Barre du bas un peu plus haute (plus loin du bord de l'écran) */
@media (max-width: 720px) {
  :root { --tabbar-lift: 12px; }
  .tabbar { height: calc(var(--tabbar-h) + var(--tabbar-lift) + env(safe-area-inset-bottom)); padding-bottom: calc(var(--tabbar-lift) + env(safe-area-inset-bottom)); }
  #app { padding-bottom: calc(32px + var(--tabbar-h) + var(--tabbar-lift)); }
}
.card-dir button { font-size: .85rem; }
.flashcard .big-py.small-py { font-size: clamp(1.2rem, 5vw, 1.6rem); color: var(--rosso); font-style: normal; }
.flashcard .face.back .big-py.small-py { color: inherit; opacity: .92; }

/* =====================================================================
   23. ANIMATIONS DE RÉPONSE
   ===================================================================== */
.quiz-card.shake { animation: shake .45s cubic-bezier(.36, .07, .19, .97); }
@keyframes shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); } 30%, 50%, 70% { transform: translateX(-8px); } 40%, 60% { transform: translateX(8px); } }
.quiz-card.pop { animation: cardPop .35s ease; }
@keyframes cardPop { 0% { transform: scale(1); } 40% { transform: scale(1.025); } 100% { transform: scale(1); } }
.bar.pulse span { animation: barPulse .6s ease; }
@keyframes barPulse { 0% { filter: brightness(1); } 40% { filter: brightness(1.35); box-shadow: 0 0 12px rgba(63, 179, 122, .8); } 100% { filter: brightness(1); } }
.burst-layer { position: fixed; inset: 0; pointer-events: none; z-index: 120; overflow: hidden; }
.burst-p { position: absolute; font-size: 1.1rem; transform: translate(-50%, -50%); animation: burst .9s cubic-bezier(.15, .7, .3, 1) forwards; }
.burst-p.dot { font-size: .55rem; color: #f5c64e; }
.burst-p.dot:nth-child(3n) { color: var(--verde); } .burst-p.dot:nth-child(3n+1) { color: #60a5fa; }
@keyframes burst { 0% { opacity: 1; transform: translate(-50%, -50%) scale(.4); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(1); } }
.xp-float, .combo-float { position: absolute; transform: translate(-50%, 0); font-weight: 900; white-space: nowrap; animation: floatUp 1.2s ease-out forwards; }
.xp-float { color: #f5a524; font-size: 1.4rem; text-shadow: 0 2px 0 rgba(0, 0, 0, .12); }
.combo-float { color: #ef4444; font-size: 1.05rem; background: var(--card); padding: 4px 12px; border-radius: 99px; box-shadow: var(--shadow); animation-delay: .1s; opacity: 0; }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.8); } 20% { opacity: 1; transform: translate(-50%, 0) scale(1.08); } 100% { opacity: 0; transform: translate(-50%, -70px) scale(1); } }
@media (prefers-reduced-motion: reduce) { .quiz-card.shake, .quiz-card.pop, .bar.pulse span { animation: none; } }

/* =====================================================================
   24. CHEMIN DU PARCOURS
   ===================================================================== */
.nodes { position: relative; }
.nodes > .node-wrap { position: relative; z-index: 1; }
.trail { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; overflow: visible; }
.trail path { fill: none; stroke-linecap: round; }
.trail path.dim { stroke: var(--line); stroke-width: 7; stroke-dasharray: 1 14; }
.trail path.lit { stroke: color-mix(in srgb, var(--oro) 70%, transparent); stroke-width: 9; animation: trailIn .8s ease both; }
@keyframes trailIn { from { stroke-dasharray: 0 400; } to { stroke-dasharray: 400 0; } }
.node-label { background: var(--card); padding: 3px 10px; border-radius: 12px; }
html.dark .trail path.dim { stroke: #3a4552; }

/* =====================================================================
   25. ÉCRAN DE SÉRIE 🔥
   ===================================================================== */
.streak-screen { position: fixed; inset: 0; z-index: 150; display: grid; place-items: center; padding: 24px;
  background: radial-gradient(circle at 50% 30%, #ffb347 0%, #ff7a18 38%, #e8451c 100%); color: #fff; opacity: 0; transition: opacity .25s; }
.streak-screen.in { opacity: 1; }
.ss-inner { width: min(420px, 100%); text-align: center; display: flex; flex-direction: column; align-items: center; }
.ss-flame { font-size: 7rem; line-height: 1; animation: flame 1.6s ease-in-out infinite; filter: drop-shadow(0 10px 20px rgba(0, 0, 0, .25)); }
@keyframes flame { 0%, 100% { transform: scale(1) rotate(-3deg); } 50% { transform: scale(1.08) rotate(3deg); } }
.streak-screen.in .ss-flame { animation: flameIn .7s cubic-bezier(.2, 1.6, .4, 1) both, flame 1.6s ease-in-out .7s infinite; }
@keyframes flameIn { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.ss-num { margin: 4px 0 0; font-size: 5rem; font-weight: 900; line-height: 1; font-family: var(--font-display); }
.ss-num b { display: inline-block; }
.ss-num b.bump { animation: bump .5s cubic-bezier(.2, 1.8, .4, 1); }
@keyframes bump { 0% { transform: scale(.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
.ss-label { margin: 0 0 14px; font-weight: 800; font-size: 1.2rem; opacity: .95; }
.ss-inner h2 { margin: 0 0 18px; font-size: 1.5rem; color: #fff; }
.ss-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; width: 100%; background: rgba(255, 255, 255, .16); padding: 12px 10px; border-radius: 18px; }
.ss-day { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.ss-day small { font-weight: 800; opacity: .85; }
.ss-day span { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; background: rgba(255, 255, 255, .22); border: 2px solid rgba(255, 255, 255, .35); }
.ss-day.on span { background: #fff; color: #e8451c; border-color: #fff; animation: dayIn .4s cubic-bezier(.2, 1.6, .4, 1) both; animation-delay: calc(.35s + var(--k) * 70ms); }
.ss-day.today span { box-shadow: 0 0 0 3px rgba(255, 255, 255, .55); }
.ss-day.future span { opacity: .5; }
@keyframes dayIn { from { transform: scale(0); } to { transform: scale(1); } }
.ss-sub { margin: 16px 0 22px; font-weight: 600; opacity: .95; }
.ss-go { width: 100%; border: 0; border-radius: 16px; padding: 16px; font-size: 1.05rem; font-weight: 900; text-transform: uppercase; letter-spacing: .05em; background: #fff; color: #e8451c; box-shadow: 0 5px 0 rgba(0, 0, 0, .2); cursor: pointer; }
.ss-go:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0, 0, 0, .2); }

}
